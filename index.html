<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Triply</title>
<meta name="description" content="Plan the trip. Keep the memories. Split the bills.">
<meta name="theme-color" content="#F6EEE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Triply">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="fonts/mali.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: glass sidebar (desktop) / glass bottom bar + FAB (mobile) around a journal-paper canvas; views swap in place. */
:root{
  --bg:#F6EEE1; --bg-2:#EFE3D0; --doodle:var(--doodle-light);
  --surface:#FFFAF2; --surface-2:#FBF3E7; --sunken:#F3E8D7;
  --glass:rgba(255,250,242,.74); --glass-brd:rgba(255,255,255,.85); --glass-hi:rgba(255,255,255,.9);
  --line:#E9DBC5; --line-2:#D9C5A7;
  --ink:#3A2A21; --ink-2:#7D6A5C; --ink-3:#B4A291;
  --coral:#E0A15A; --coral-2:#A63D2A; --coral-ink:#8E3423; --coral-soft:#F7E2CC;
  --mint:#E7EBD3; --mint-ink:#4F6B35; --blue:#E1E8EC; --blue-ink:#3F6680;
  --peach:#F8E6C0; --peach-ink:#85590E; --lav:#EEE2E8; --lav-ink:#7A4E6E; --rose:#F7DED4; --rose-ink:#A0452E;
  --brand:#A63D2A; --brand-2:#C4553B; --on-brand:#FFFFFF;
  --ok:#4A8A3E; --ok-bg:#E6EFD8; --warn:#B9730F; --warn-bg:#FBEBCB; --bad:#B83A2B; --bad-bg:#F8DDD6;
  --shadow-sm:0 1px 2px rgba(90,50,25,.07);
  --shadow:0 1px 2px rgba(90,50,25,.06),0 10px 28px -14px rgba(110,60,30,.26);
  --shadow-lg:0 2px 6px rgba(90,50,25,.07),0 24px 56px -22px rgba(110,60,30,.34);
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --f-display:'Mali','Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  --f-body:'Mali','Zen Maru Gothic','Hiragino Sans','Noto Sans Thai',system-ui,sans-serif;
  --f-hand:'Mali','Zen Maru Gothic',cursive;
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-out:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1512; --bg-2:#231A16; --doodle:var(--doodle-dark);
  --surface:#2A201B; --surface-2:#30251F; --sunken:#221A16;
  --glass:rgba(42,32,27,.72); --glass-brd:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.1);
  --line:#3D2F27; --line-2:#4B3A30;
  --ink:#F5EADC; --ink-2:#BFA997; --ink-3:#7A6656;
  --coral:#E0A15A; --coral-2:#E07A5F; --coral-ink:#F2B39A; --coral-soft:#3A2620;
  --mint:#26301C; --mint-ink:#B5CF96; --blue:#1E2A33; --blue-ink:#A9C6DA;
  --peach:#3A2E18; --peach-ink:#F0C670; --lav:#33262F; --lav-ink:#DDB9D4; --rose:#3D2520; --rose-ink:#F2A890;
  --brand:#C4553B; --brand-2:#D9694E; --on-brand:#FFFFFF;
  --ok:#8CCB7A; --ok-bg:#24301D; --warn:#F0B45A; --warn-bg:#3A2C16; --bad:#F08070; --bad-bg:#3D211C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 24px 60px -20px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1C1512; --bg-2:#231A16; --doodle:var(--doodle-dark);
  --surface:#2A201B; --surface-2:#30251F; --sunken:#221A16;
  --glass:rgba(42,32,27,.72); --glass-brd:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.1);
  --line:#3D2F27; --line-2:#4B3A30;
  --ink:#F5EADC; --ink-2:#BFA997; --ink-3:#7A6656;
  --coral:#E0A15A; --coral-2:#E07A5F; --coral-ink:#F2B39A; --coral-soft:#3A2620;
  --mint:#26301C; --mint-ink:#B5CF96; --blue:#1E2A33; --blue-ink:#A9C6DA;
  --peach:#3A2E18; --peach-ink:#F0C670; --lav:#33262F; --lav-ink:#DDB9D4; --rose:#3D2520; --rose-ink:#F2A890;
  --brand:#C4553B; --brand-2:#D9694E; --on-brand:#FFFFFF;
  --ok:#8CCB7A; --ok-bg:#24301D; --warn:#F0B45A; --warn-bg:#3A2C16; --bad:#F08070; --bad-bg:#3D211C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 24px 60px -20px rgba(0,0,0,.7); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
@media (max-width:880px){
  .inp,select.inp,textarea.inp,.filters .search .inp{font-size:16px}
  .bb a,.btn,.chip,.daytab,.polaroid,.payer,.exp,.pick button,.seg button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .exp:hover,.stop .body:hover,.mt:hover,.polaroid:hover{transform:none}
  .exp:active{transform:scale(.98)}
}
@media (display-mode:standalone){
  .topbar{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .toasts{top:calc(16px + env(safe-area-inset-top,0px))}
}
.install{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:linear-gradient(135deg,var(--coral-soft),var(--surface));border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.install img{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 8px 18px -8px rgba(140,55,30,.8)}
.install b{display:block;font-family:var(--f-display);font-size:16px}
.install small{color:var(--ink-2);font-size:12.5px;display:block;line-height:1.4}
.install .row{flex-wrap:nowrap;gap:6px;margin-left:auto}
@media (max-width:480px){.install{flex-wrap:wrap}.install .row{width:100%;margin-left:0}.install .row .btn{flex:1}}
.ios-steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.ios-steps li{display:flex;gap:12px;align-items:center;font-size:15px;counter-increment:s}
.ios-steps li::before{content:counter(s);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--coral-soft);color:var(--coral-ink);font-weight:700;flex:none}
.sheet.dragging{transition:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:var(--doodle);background-size:420px 420px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--coral-2);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px} svg.i.lg{width:24px;height:24px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:20px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-right:1px solid var(--glass-brd);box-shadow:inset -1px 0 0 var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px}
.brand .logo{width:42px;height:42px;border-radius:12px;box-shadow:0 6px 16px -6px rgba(140,55,30,.7);transition:transform .5s var(--ease-spring)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{color:var(--ink-2);font-size:11.5px;display:block}
.nav{position:relative;display:flex;flex-direction:column;gap:4px}
.nav-ind{position:absolute;left:0;right:0;height:48px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);
  border:1px solid var(--glass-brd);transition:transform .55s var(--ease-spring),opacity .3s;z-index:0}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:46px;font-size:14px;padding:0 14px;border-radius:14px;color:var(--ink-2);text-decoration:none;font-weight:500;transition:color .2s}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink)}
.nav a.on{color:var(--brand)} .nav a.on svg{color:var(--brand)}
.nav a .lbl{display:flex;flex-direction:column;line-height:1.2}
.nav a .lbl small{font-size:10.5px;color:var(--ink-3);font-weight:400}
.side .add-btn{margin-top:4px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.trip-mini{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.trip-mini .cv{width:40px;height:40px;border-radius:11px;overflow:hidden;flex:none}
.trip-mini .cv img{width:100%;height:100%;object-fit:cover;display:block}
.trip-mini b{font-size:13.5px;display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-mini small{font-size:11.5px;color:var(--ink-2)}
.trip-mini>div{min-width:0}

.main{min-width:0;padding:28px clamp(16px,3.2vw,44px) 120px;max-width:1240px;width:100%;margin:0 auto}
.topbar{display:none}
.bottombar{display:none}

@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:8px 16px 128px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
    margin:0 -16px 10px;padding:10px 16px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0}
  .topbar .brand .logo{width:34px;height:34px;border-radius:10px}
  .topbar .brand b{font-size:19px}
  .bottombar{display:block;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;
    border-radius:26px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
    border:1px solid var(--glass-brd);box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-hi)}
  .bb{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:66px;padding:0 6px}
  .bb a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-2);text-decoration:none;font-weight:500;padding:8px 0}
  .bb a.on{color:var(--brand)} .bb a.on svg{color:var(--brand);transform:translateY(-1px)}
  .bb a svg{transition:transform .4s var(--ease-spring)}
  .bb-ind{position:absolute;top:8px;height:50px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .55s var(--ease-spring),width .3s;z-index:0}
  .fab{justify-self:center;width:58px;height:58px;margin-top:-30px;border-radius:20px;border:0;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 12px 24px -8px rgba(140,55,30,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .35s var(--ease-spring)}
  .fab:active{transform:scale(.9)}
  .fab svg{width:26px;height:26px;stroke-width:2.4}
}

/* ---------- primitives ---------- */
.btn{--h:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 20px;border-radius:999px;border:1px solid transparent;
  font-weight:600;font-size:13.5px;white-space:nowrap;position:relative;overflow:hidden;transition:transform .25s var(--ease-spring),box-shadow .25s,background .2s,border-color .2s,opacity .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:linear-gradient(160deg,var(--brand-2),var(--brand));color:var(--on-brand);box-shadow:0 8px 18px -8px rgba(140,55,30,.65),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary:hover{box-shadow:0 12px 24px -8px rgba(140,55,30,.75),inset 0 1px 0 rgba(255,255,255,.22);transform:translateY(-1px)}
.btn-soft{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow-sm)}
.btn-soft:hover{border-color:var(--line-2);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink-2)} .btn-ghost:hover{background:var(--sunken);color:var(--ink)}
.btn-danger{background:var(--bad-bg);color:var(--bad)} .btn-danger:hover{filter:brightness(.97)}
.btn,a.btn{text-decoration:none}
.btn-sm{--h:36px;padding:0 14px;font-size:13.5px;border-radius:999px}
.btn-icon{width:var(--h);padding:0}
.btn-block{width:100%}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:ripple .6s var(--ease-out) forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ttl{font-family:var(--f-display);font-size:16px;font-weight:600;line-height:1.3}
.bi{display:inline-flex;flex-direction:column;line-height:1.25;min-width:0}
.bi .s{font-size:.68em;font-weight:500;color:var(--ink-2);font-family:var(--f-body);letter-spacing:0;margin-top:1px}
.muted{color:var(--ink-2)} .tiny{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--sunken);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;transition:all .2s var(--ease-out)}
button.chip:hover{color:var(--ink);border-color:var(--line-2)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--blue);color:var(--blue-ink)} .b-lav{background:var(--lav);color:var(--lav-ink)} .b-mute{background:var(--sunken);color:var(--ink-2)}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--sunken);border:1px solid var(--line);position:relative;gap:2px;max-width:100%;overflow-x:auto}
.seg button{position:relative;z-index:1;border:0;background:transparent;height:34px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:color .2s}
.seg button.on{color:#fff;background:var(--brand);box-shadow:var(--shadow-sm)}
.av{--c:#999;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--c);
  box-shadow:0 0 0 2.5px var(--surface);flex:none;font-family:var(--f-display);transition:transform .35s var(--ease-spring)}
.av.sm{width:26px;height:26px;font-size:11px} .av.lg{width:44px;height:44px;font-size:16px}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 16px;color:var(--ink-2)}
.empty img{width:120px;height:auto;opacity:.95}
.empty p{margin:0;max-width:34ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.hr{height:1px;background:var(--line);margin:14px 0}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}
textarea.inp{height:auto;padding:12px 14px;min-height:72px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;font-weight:500;min-height:0}
.amount-inp{display:flex;align-items:baseline;gap:8px;padding:14px 18px;border-radius:20px;background:var(--coral-soft);border:1.5px solid transparent;transition:border-color .2s}
.amount-inp:focus-within{border-color:var(--brand)}
.amount-inp span{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--brand)}
.amount-inp input{border:0;background:transparent;outline:none;font-family:var(--f-display);font-size:30px;font-weight:700;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;transition:all .25s var(--ease-out)}
.pick button.noav{padding:0 14px}
.pick button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.pick button:active{transform:scale(.95)}
.share-rows{display:flex;flex-direction:column;gap:8px}
.share-row{display:grid;grid-template-columns:auto 1fr 120px;align-items:center;gap:10px}
.share-row .inp{height:40px;text-align:right}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line-2);border:0;flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .4s var(--ease-spring)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}

/* ---------- view transitions ---------- */
.view{display:flex;flex-direction:column;gap:20px}
.anim .rv{animation:rise .7s var(--ease-out) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.view.leaving{animation:leave .16s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateY(-6px)}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:clamp(20px,2.6vw,26px);line-height:1.2}
.page-head p{margin:4px 0 0;color:var(--ink-2)}

/* demo strip */
.demo{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--lav);color:var(--lav-ink);font-size:13.5px;flex-wrap:wrap}
.demo b{font-weight:700}
@media (max-width:640px){.demo{border-radius:20px;padding:12px 14px}}
.demo .spacer{min-width:8px}

/* ---------- dashboard ---------- */
.hero-hi{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-hi h1{font-size:clamp(26px,3.6vw,36px);line-height:1.15}
.hero-hi h1 .wave{display:inline-block;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-6deg)}}
.hero-hi p{margin:6px 0 0;color:var(--ink-2)}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
.dash .col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1060px){.dash{grid-template-columns:minmax(0,1fr)}}

.hero-scene{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:190px;box-shadow:var(--shadow);isolation:isolate;border:1px solid var(--line)}
.hero-scene>svg.cm-hero{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.cm-hero .lf{transform-box:fill-box;animation:lantern 7s ease-in-out infinite}
@keyframes lantern{0%,100%{translate:0 0}50%{translate:4px -10px}}
.cm-hero .truck{animation:truck 1.4s ease-in-out infinite}
@keyframes truck{50%{translate:0 -1.5px}}
@keyframes drift{to{transform:scale(1.07) translateX(-1.5%)}}
.hero-scene .in{background:linear-gradient(90deg,rgba(248,228,198,.95) 0,rgba(248,228,198,.75) 38%,rgba(248,228,198,0) 62%);height:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 90px;color:#3A2A21}
.hero-scene .hs-hi{font-weight:600;font-size:13.5px;color:#8E3423;display:flex;align-items:center;gap:6px}
.hero-scene .wave{color:#D9826A}
.hero-scene h1{font-size:clamp(19px,2.4vw,25px);line-height:1.2;margin-top:4px;color:#2F3A31}
.hero-scene .bi .s{color:#5E665C}
.hero-scene p{margin:6px 0 0;color:#5E665C;font-size:14px;max-width:40ch}
.hero-scene .av{box-shadow:0 0 0 3px #fff}
.hero-scene{min-height:230px;display:flex}.hero-scene .in{flex:1;align-self:stretch}.hero-scene>svg.cm-hero{}
@media (max-width:640px){.hero-scene{min-height:170px}.hero-scene .in{padding:14px 16px 80px;background:linear-gradient(180deg,rgba(248,228,198,.95) 0,rgba(248,228,198,.7) 45%,rgba(248,228,198,0) 70%)}.hero-scene h1{font-size:19px}}
/* boarding pass */
.pass{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 210px;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-lg);border:1px solid var(--line);overflow:hidden;
  transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease-out)}
.pass-art{position:relative;min-height:260px;overflow:hidden;isolation:isolate}
.pass-art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 1.2s var(--ease-out)}
.pass:hover .pass-art>img{transform:scale(1.09)}
.pass-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,25,35,0) 30%,rgba(30,25,35,.55));z-index:1}
.pass-top{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;gap:8px;z-index:3}
.glass-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:#2E2A33;
  background:rgba(255,255,255,.62);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.pass-txt{position:absolute;left:20px;right:20px;bottom:18px;z-index:3;color:#fff}
.pass-txt small{font-size:12px;font-weight:600;opacity:.9;letter-spacing:.06em}
.pass-txt h2{font-size:clamp(24px,3vw,32px);line-height:1.15;margin-top:2px;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.pass-txt .s2{font-size:14px;opacity:.85;font-weight:500}
.flight{position:absolute;inset:0;z-index:2;pointer-events:none}
.flight svg{position:absolute;inset:0;width:100%;height:100%}
.flight svg.plane{inset:auto;left:0;top:0;width:28px;height:28px}
.plane{position:absolute;left:0;top:0;width:28px;height:28px;color:#fff;offset-path:path('M 30 150 C 140 40, 260 40, 380 90');offset-rotate:auto;animation:fly 6s var(--ease-out) infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
@keyframes fly{0%{offset-distance:0%;opacity:0}8%{opacity:1}80%{opacity:1}100%{offset-distance:100%;opacity:0}}
.stub{position:relative;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;border-left:2px dashed var(--line-2);background:var(--surface-2)}
.stub::before,.stub::after{content:"";position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.stub::before{top:-12px}.stub::after{bottom:-12px}
.count{display:flex;align-items:baseline;gap:6px}
.count b{font-family:var(--f-display);font-size:40px;line-height:1;font-weight:700;letter-spacing:-.03em}
.count span{font-weight:600;color:var(--ink-2)}
.stub .meta{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.stub .meta div{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.stub .meta b{color:var(--ink);font-weight:600}
.stub .acts{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.more-trips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.mt{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);white-space:nowrap;cursor:pointer;transition:transform .3s var(--ease-spring)}
.mt:hover{transform:translateY(-2px)}
.mt img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.mt b{font-size:13.5px;display:block}.mt small{font-size:12px;color:var(--ink-2)}
@media (max-width:640px){
  .pass{grid-template-columns:1fr}
  .pass-art{min-height:220px}
  .stub{border-left:0;border-top:2px dashed var(--line-2)}
  .stub::before,.stub::after{top:-13px;left:auto;bottom:auto}
  .stub::before{left:-12px}.stub::after{right:-12px}
  .stub .acts{flex-direction:row}.stub .acts .btn{flex:1}
}

/* liquid gauge */
.budget-card .gwrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:420px){.budget-card .gwrap{grid-template-columns:120px minmax(0,1fr);gap:14px}}
.gauge{position:relative;aspect-ratio:1;width:100%;max-width:150px}
.gauge svg{width:100%;height:100%;display:block;overflow:visible}
.gauge .lvl{transition:transform 1.6s var(--ease-out)}
.gauge .wv1{animation:wv 3.2s linear infinite}
.gauge .wv2{animation:wv 5s linear infinite reverse}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.gauge .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.gauge .pct b{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em}
.gauge .pct small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600}
.gauge .glint{fill:#fff;opacity:.55}
.kv{display:flex;flex-direction:column;gap:10px}
.kv .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kv .v{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;letter-spacing:-.01em}
.kv .v.sm{font-size:15.5px}
.kv .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;font-size:13.5px;font-weight:500;margin-top:14px}
.alert svg{margin-top:2px}
.alert.ok{background:var(--ok-bg);color:var(--ok)} .alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.bad{background:var(--bad-bg);color:var(--bad)}
.catbars{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.cb{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.cb .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.cb .ic svg{width:16px;height:16px}
.cb .track{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:4px}
.cb .fill{height:100%;border-radius:99px;transform-origin:left;animation:grow 1.1s var(--ease-out) both;animation-delay:calc(var(--i,0)*80ms + 200ms)}
@keyframes grow{from{transform:scaleX(0)}}
.cb .nm{display:flex;justify-content:space-between;gap:8px}
.cb .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* who paid */
.payers{display:flex;flex-direction:column;gap:6px}
.payer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:16px;border:0;background:transparent;text-align:left;width:100%;transition:background .2s}
.payer:hover{background:var(--sunken)}
.payer:hover .av{transform:translateY(-3px) rotate(-6deg)}
.payer .bars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.payer .bar{height:8px;border-radius:99px;transform-origin:left;animation:grow 1s var(--ease-out) both;animation-delay:calc(var(--i,0)*90ms + 250ms)}
.payer .bar.resp{height:4px;opacity:.45}
.payer .amt{text-align:right}
.payer .amt b{font-family:var(--f-display);font-size:15px;display:block}
.payer .amt small{font-size:12px;color:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:6px;border-radius:99px;background:var(--ink-3);margin-right:6px;vertical-align:middle}
.legend i.l{height:3px;opacity:.6}
.split-strip{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px;margin:4px 0 14px}
.split-strip span{height:100%;border-radius:99px;transform-origin:left;animation:grow 1.2s var(--ease-out) both}

/* attention + activity */
.xfer{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.xfer .arrow{color:var(--ink-3);display:flex;align-items:center}
.xfer .amt{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:17px}
.xfer .who{font-size:13.5px;min-width:0}
.xfer .who b{font-weight:600}
.acts-list{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border-radius:14px;border:0;background:transparent;text-align:left;width:100%;transition:background .2s}
.act:hover{background:var(--sunken)}
.act .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.act .t{font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.act small{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* ---------- plan ---------- */
.trip-rail{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 14px;margin:0 -4px;scroll-snap-type:x proximity}
.polaroid{flex:none;width:170px;padding:8px 8px 10px;background:var(--surface);border-radius:16px;border:1.5px solid var(--line);box-shadow:var(--shadow);cursor:pointer;scroll-snap-align:start;
  transform:rotate(var(--rot,0deg));transition:transform .45s var(--ease-spring),border-color .2s,box-shadow .3s;text-align:left}
.polaroid:hover{transform:rotate(0) translateY(-4px);box-shadow:var(--shadow-lg)}
.polaroid.on{border-color:var(--coral-2);transform:rotate(0) translateY(-2px)}
.polaroid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.polaroid b{display:block;font-size:13.5px;margin-top:8px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.polaroid small{font-size:12px;color:var(--ink-2)}
.polaroid.new{display:grid;place-items:center;align-content:center;gap:8px;min-height:170px;border-style:dashed;color:var(--ink-2);background:var(--surface-2);font-weight:600}
.polaroid.new .plus{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--coral-soft);color:var(--coral-ink)}
.trip-hero{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:220px;display:flex;align-items:flex-end;box-shadow:var(--shadow-lg);isolation:isolate}
.trip-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.trip-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,26,0) 25%,rgba(20,18,26,.6));z-index:-1}
.trip-hero .in{width:100%;padding:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;color:#fff}
.trip-hero h1{font-size:clamp(21px,2.8vw,28px);line-height:1.15;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.trip-hero .s2{opacity:.85;font-weight:500;font-size:15px}
.trip-hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.glass-bar{display:flex;gap:6px;padding:6px;border-radius:18px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.glass-bar .btn{color:#2E2A33;background:transparent;--h:38px;padding:0 12px;font-size:13.5px}
.glass-bar .btn:hover{background:rgba(255,255,255,.7)}
.glass-bar .btn.btn-primary{background:linear-gradient(160deg,var(--brand-2),var(--brand));color:#fff}
.plan-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1060px){.plan-grid{grid-template-columns:minmax(0,1fr)}}
.daytabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.daytab{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left;transition:all .25s var(--ease-out);min-width:92px}
.daytab b{font-family:var(--f-display);font-size:13.5px}
.daytab small{font-size:12px;color:var(--ink-2)}
.daytab.on{background:var(--brand);border-color:var(--brand);color:#fff} .daytab.on small{color:#fff;opacity:.8}
.timeline{position:relative;display:flex;flex-direction:column;gap:12px;padding:8px 0 4px}
.timeline::before{content:"";position:absolute;left:62px;top:14px;bottom:14px;border-left:2px dashed var(--line-2)}
.stop{position:relative;display:grid;grid-template-columns:50px 26px minmax(0,1fr);gap:10px;align-items:start}
.stop .tm{font-family:var(--f-display);font-weight:600;font-size:14px;text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.stop .pin{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin-top:10px;box-shadow:0 0 0 4px var(--surface)}
.stop .pin svg{width:14px;height:14px}
.stop .body{padding:12px 14px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);transition:transform .3s var(--ease-spring),box-shadow .3s}
.stop .body:hover{box-shadow:var(--shadow);transform:translateX(2px)}
.stop.cancelled .body{opacity:.55} .stop.cancelled .nm{text-decoration:line-through}
.stop .nm{font-weight:600;font-size:14px;line-height:1.35}
.stop .nm small{display:block;font-weight:500;font-size:12px;color:var(--ink-2)}
.stop .note{font-size:13px;color:var(--ink-2);margin-top:2px}
.stop .money{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.stop .money b{color:var(--ink);font-weight:600}
.stop .money .act-v b{color:var(--coral-ink)}
.stop .tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;align-items:center}
.stop .tools .btn{--h:32px;padding:0 10px;font-size:12.5px;border-radius:10px}
.place-spend{display:flex;flex-direction:column;gap:12px}
.ps{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.ps .track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;position:relative}
.ps .track span{position:absolute;inset:0 auto 0 0;border-radius:99px;transform-origin:left;animation:grow 1s var(--ease-out) both}
.ps .track .est{background:var(--line-2)}
.ps .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- journal (hand-drawn day plan) — paper colours fixed: it's a physical page ---------- */
.journal{position:relative;margin-top:12px;padding:22px 18px 26px;border-radius:22px;color:#2F2C2A;font-family:var(--f-body);
  background:#FBF5E8;background-image:radial-gradient(rgba(140,110,60,.07) 1px,transparent 1.3px);background-size:16px 16px;box-shadow:inset 0 0 0 1px #EADFC8,0 10px 24px -16px rgba(80,60,30,.35);overflow:hidden}
.j-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.j-title{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.05;color:#24405F;letter-spacing:-.01em}
.j-title small{display:block;font-size:.42em;color:#4E7559;font-weight:600;margin-top:4px;letter-spacing:0}
.j-brush{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 16px 5px;background:#F6B9AA;border-radius:46% 54% 42% 58%/62% 38% 62% 38%;transform:rotate(-2deg);font-weight:500;font-size:14px;color:#3A2A26}
.j-heart{width:15px;height:15px;fill:#E36D86;flex:none;vertical-align:-2px}
.j-heart.big{width:26px;height:26px}
.j-sticky{position:relative;width:148px;padding:18px 12px 12px;background:#F3E2C4;transform:rotate(3deg);box-shadow:0 8px 14px -8px rgba(0,0,0,.3);font-size:13.5px;line-height:1.55;text-align:center;white-space:pre-line;color:#3B3632}
.j-sticky::before{content:"";position:absolute;top:-9px;left:50%;width:58px;height:20px;transform:translateX(-50%) rotate(-5deg);background:rgba(240,150,150,.7)}
.j-flight{display:block;width:min(240px,60%);height:auto;margin:-6px 0 0 auto}
.j-plane{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translate(168px,14px) rotate(-8deg)}}
.j-stops{position:relative;margin-top:4px}
.j-stop{position:relative;width:min(84%,440px)}
.j-stop.r{margin-left:auto}
.j-stop.cancelled{opacity:.45}
.j-label{display:flex;align-items:center;gap:8px}
.j-stop.r .j-label{justify-content:flex-end}
.j-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.j-name{border:0;padding:3px 14px 4px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:14.5px;line-height:1.3;border-radius:6px 16px 8px 18px/14px 6px 16px 8px;transform:rotate(-1.5deg);text-align:left;max-width:100%;cursor:pointer}
.j-name:hover{filter:brightness(1.05)}
.j-time{display:inline-block;margin:6px 0 0 38px;padding:0 4px 1px;font-weight:600;font-size:14.5px;border-bottom:2px solid #2F2C2A}
.j-stop.r .j-time{display:block;width:max-content;margin:6px 0 0 auto}
.j-body{display:flex;gap:8px;align-items:center;margin-top:2px}
.j-stop.r .j-body{flex-direction:row-reverse}
.j-body .illo{width:min(220px,60%)}
.j-note{flex:1;min-width:0;font-style:italic;font-weight:500;font-size:13px;line-height:1.5;color:#4A4440}
.j-stop.r .j-note{text-align:right}
.j-spent{display:inline-block;margin:4px 6px 0 0;padding:1px 8px;border-radius:999px;background:#E6EEDC;color:#3E6049;font-style:normal;font-weight:700;font-size:12px}
.j-conn{display:block;width:100%;height:46px;margin:-4px 0}
.j-conn .ink{stroke-dasharray:.02 .025}
.illo{display:block;height:auto;overflow:visible}
.illo .ink{fill:none;stroke:#33302E;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.j-conn .ink{fill:none;stroke:#33302E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.illo.mini{width:56px}

.xf{display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.xf .lane{position:relative;height:2px;border-top:2px dashed var(--line-2);width:44px}
.xf .lane::after{content:"";position:absolute;top:-6px;left:0;width:8px;height:8px;border-radius:50%;background:var(--coral-2);animation:lane 1.8s ease-in-out infinite}
@keyframes lane{0%{transform:translateX(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(38px);opacity:0}}
.xf .txt{font-size:14px;min-width:0}
.xf .txt b{font-family:var(--f-display);font-size:16px;display:block}
@media (max-width:560px){.xf{grid-template-columns:auto auto auto minmax(0,1fr)}.xf .btn{grid-column:1/-1}}
.hist{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-size:13.5px}
.hist:nth-child(odd){background:var(--surface-2)}
.hist.void{opacity:.5}.hist.void .amt{text-decoration:line-through}
.hist .amt{font-family:var(--f-display);font-weight:700;margin-left:auto}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(30,24,30,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:81;left:50%;bottom:0;width:min(600px,100%);max-height:min(92vh,900px);display:flex;flex-direction:column;
  background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);transform:translate(-50%,104%);transition:transform .5s var(--ease-spring);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translate(-50%,0)}
@media (min-width:881px){.sheet{bottom:auto;top:50%;border-radius:28px;transform:translate(-50%,-46%) scale(.94);opacity:0;transition:transform .45s var(--ease-spring),opacity .25s}.sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:10px auto 0;flex:none}
@media (min-width:881px){.sheet .grab{display:none}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px 6px}
.sheet .sh h3{font-size:17px}
.sheet .sb{padding:10px 22px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sheet .sf{padding:12px 22px 18px;display:flex;gap:10px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 28px 28px}
.sheet .sf .btn{flex:1}
.sheet.small{width:min(440px,100%)}

/* toast */
.toasts{position:fixed;z-index:120;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:18px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow-lg);font-weight:500;font-size:14px;animation:tin .6s var(--ease-spring) both}
.toast.out{animation:tout .3s ease-in forwards}
.toast .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.toast .ic svg{width:17px;height:17px}
.toast .undo{margin-left:auto;border:0;background:transparent;font-weight:700;color:var(--coral-ink);padding:4px 6px}
@keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px) scale(.96)}}
.coin{position:fixed;z-index:130;width:34px;height:34px;border-radius:50%;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFE9A8,#F6C453 60%,#E0A63A);box-shadow:0 6px 14px -4px rgba(200,140,40,.7),inset 0 -2px 0 rgba(0,0,0,.08);color:#9A6A12;font-weight:800;font-size:16px;font-family:var(--f-display)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:125}

/* splash */
.splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);transition:opacity .5s .1s,visibility .5s .1s}
.splash.done{opacity:0;visibility:hidden}
.splash .sp{display:flex;flex-direction:column;align-items:center;gap:14px}
.splash img{width:96px;height:96px;border-radius:26px;box-shadow:0 18px 40px -14px rgba(140,55,30,.8);animation:pop .8s var(--ease-spring) both}
.splash b{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;display:flex;overflow:hidden}
.splash b span{display:inline-block;animation:letter .6s var(--ease-out) both;animation-delay:calc(.25s + var(--i)*45ms)}
.splash small{color:var(--ink-2);animation:rise .6s .6s var(--ease-out) both}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
@keyframes letter{from{transform:translateY(110%)}}

/* ---------- receipt studio ---------- */
.studio{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.studio{grid-template-columns:minmax(0,1fr)}.studio .controls{order:2}}
.controls{position:sticky;top:20px;display:flex;flex-direction:column;gap:18px;padding:20px;border-radius:var(--r-xl);
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
@media (max-width:1000px){.controls{position:static}}
.controls .grp{display:flex;flex-direction:column;gap:8px}
.style-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.style-pick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 10px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;transition:all .25s var(--ease-spring)}
.style-pick button:hover{transform:translateY(-2px)}
.style-pick button.on{border-color:var(--coral-2);box-shadow:0 0 0 3px var(--coral-soft)}
.style-pick .thumb{width:100%;aspect-ratio:3/4;border-radius:10px;position:relative;overflow:hidden}
.swatches{display:flex;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-2);transition:transform .3s var(--ease-spring)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--ink);transform:scale(1.1)}
.toggles{display:flex;flex-direction:column;gap:2px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;font-weight:500}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exports .btn{font-size:13.5px}
.stage{position:relative;border-radius:var(--r-xl);padding:0 16px 30px;min-height:500px;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,var(--bg-2),var(--bg));border:1px solid var(--line);overflow:hidden}
.printer{position:relative;z-index:3;width:min(440px,100%);height:28px;margin-top:22px;border-radius:14px;background:linear-gradient(180deg,#4B5A4D,#2E3A31);box-shadow:0 10px 20px -8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.printer::after{content:"";position:absolute;left:16px;right:16px;top:12px;height:5px;border-radius:9px;background:#141218}
.printer i{position:absolute;right:16px;top:-7px;width:7px;height:7px;border-radius:50%;background:#7EE0A4;box-shadow:0 0 8px #7EE0A4;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.feed{position:relative;z-index:2;width:min(400px,calc(100% - 20px));margin-top:-12px;overflow:hidden;padding:0 12px 24px}
.feed.printing #receiptCapture{animation:print 1.8s cubic-bezier(.3,.7,.2,1) both}
@keyframes print{0%{transform:translateY(-100%)}55%{transform:translateY(-12%)}70%{transform:translateY(-10%)}100%{transform:none}}
.stamp-anim{animation:stamp .6s 1.6s var(--ease-spring) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-24deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
.capturing *{animation:none!important;transition:none!important}

/* receipt base — paper colours are fixed (it's a physical object) */
#receiptCapture{--rc-a:#C4553B;--rc-a2:#F7E2CC;--rc-ink:#383B42;--rc-mute:#8A8690;--rc-paper:#FFFDF8;--rc-line:#E9DFD2;
  position:relative;padding:22px 16px 28px;background:#EFEBDF;border-radius:22px;--stage-bg:#EFEBDF;color:var(--rc-ink);font-family:var(--f-body)}
.rc{position:relative;background:var(--rc-paper);color:var(--rc-ink);box-shadow:0 18px 40px -18px rgba(100,60,40,.35),0 2px 4px rgba(100,60,40,.06)}
.rc .rl{display:flex;flex-direction:column;line-height:1.25}
.rc .rl .s{font-size:.78em;color:var(--rc-mute);font-weight:500;margin-top:1px}
.rc .row2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;font-size:13.5px}
.rc .row2 .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc .dash{border-top:2px dashed var(--rc-line);margin:12px 0;height:0}
.rc .sec{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--rc-ink);margin:2px 0 6px;display:flex;align-items:center;gap:6px}
.rc .sec::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--rc-a)}
.rc .total{border-radius:18px;padding:14px 16px;background:var(--rc-a2);display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
.rc .total b{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.rc .mem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.rc .mem .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:700;font-family:var(--f-display)}
.rc .mem .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rc .mem .nums{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--rc-mute);white-space:nowrap}
.rc .mem .nums b{color:var(--rc-ink);font-size:13px}
.rc .pos{color:#2C8455}.rc .neg{color:#C2493D}
.rc .foot{text-align:center;font-family:var(--f-hand);font-size:17px;color:var(--rc-ink);margin-top:10px;line-height:1.4}
.rc .foot small{display:block;font-family:var(--f-body);font-size:11px;color:var(--rc-mute);margin-top:6px}
.rc .stk{position:absolute;pointer-events:none}
.rc .stamp{position:relative;display:inline-block;border:2.5px solid currentColor;border-radius:12px;padding:5px 10px;font-family:var(--f-display);font-weight:700;font-size:13px;text-align:center;line-height:1.15;transform:rotate(-12deg);opacity:.85}
.rc .xrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.rc .xrow .arr{color:var(--rc-mute)}
.rc .xrow .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.rc .cover{display:block;width:100%;object-fit:cover}

/* Style A — Kawaii Café */
.rcA{border-radius:6px;padding:26px 22px 22px}
.rcA .zig{position:absolute;left:0;right:0;height:12px;display:block;width:100%}
.rcA .zig.t{top:-11px}.rcA .zig.b{bottom:-11px;transform:scaleY(-1)}
.rcA .brandline{text-align:center;font-family:var(--f-display);font-weight:700;font-size:11px;color:var(--rc-mute);letter-spacing:.1em;white-space:nowrap}
.rcA h2{text-align:center;font-family:var(--f-display);font-size:21px;line-height:1.2;margin:8px 0 2px}
.rcA .h2s{text-align:center;color:var(--rc-mute);font-size:13px}
.rcA .meta{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--rc-mute);margin-top:8px}
.rcA .cover{height:120px;border-radius:16px;margin:14px 0 4px}
.rcA .pill-h{display:block;width:max-content;max-width:100%;margin:0 auto;text-align:center;background:var(--rc-a2);border-radius:999px;padding:3px 12px;font-family:var(--f-display);font-weight:700;font-size:12.5px}
/* Style B — Journal */
.rcB{border-radius:10px;padding:22px 22px 24px;background:
  repeating-linear-gradient(180deg,transparent 0 27px,rgba(140,170,210,.22) 27px 28px),var(--rc-paper)}
.rcB::before{content:"";position:absolute;top:0;bottom:0;left:16px;border-left:2px solid rgba(244,169,149,.45)}
.rcB .tape{position:absolute;height:26px;width:96px;opacity:.85;border-radius:3px}
.rcB .photo{background:#fff;padding:10px 10px 30px;box-shadow:0 8px 20px -10px rgba(0,0,0,.35);transform:rotate(-2deg);margin:8px 6px 14px 14px;position:relative}
.rcB .photo .cover{height:150px;border-radius:2px}
.rcB .photo .cap{position:absolute;left:12px;right:12px;bottom:6px;font-family:var(--f-hand);font-size:15px;color:#5a5560;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcB h2{font-family:var(--f-hand);font-size:28px;line-height:1.15;font-weight:400;margin:4px 0 0 14px}
.rcB .h2s{margin-left:14px;color:var(--rc-mute);font-size:13px}
.rcB .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px 14px}
.rcB .fields div{border-bottom:1.5px solid var(--rc-line);padding-bottom:4px;font-size:12px;color:var(--rc-mute)}
.rcB .fields b{display:block;color:var(--rc-ink);font-size:14px;font-weight:600}
.rcB .body{margin-left:14px}
.rcB .total{background:transparent;border:2px dashed var(--rc-a);}
/* Style C — Ticket */
.rcC{border-radius:24px;overflow:hidden;padding:0}
.rcC .band{padding:18px 20px 16px;color:#383B42;position:relative}
.rcC .band .brandline{font-family:var(--f-display);font-weight:700;font-size:11.5px;letter-spacing:.28em;opacity:.7}
.rcC .band h2{font-family:var(--f-display);font-size:24px;line-height:1.15;margin-top:6px}
.rcC .band .h2s{font-size:13px;opacity:.75}
.rcC .codes{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.rcC .codes b{font-family:var(--f-display);font-size:26px;letter-spacing:.02em}
.rcC .codes small{display:block;font-size:11px;opacity:.7;font-weight:600}
.rcC .perf{position:relative;height:22px;background:var(--rc-paper)}
.rcC .perf::before{content:"";position:absolute;left:18px;right:18px;top:10px;border-top:2.5px dashed var(--rc-line)}
.rcC .perf i{position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:var(--stage-bg,#EFEBDF)}
.rcC .perf i.l{left:-11px}.rcC .perf i.r{right:-11px}
.rcC .inner{padding:6px 20px 20px}
.rcC .cover{height:110px}
.rcC .barcode{height:38px;margin-top:12px;border-radius:4px;background:repeating-linear-gradient(90deg,#383B42 0 2px,transparent 2px 4px,#383B42 4px 5px,transparent 5px 8px,#383B42 8px 11px,transparent 11px 12px)}
.rcC .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.rcC .grid3 div{padding:10px;border-radius:14px;background:var(--rc-a2);font-size:11.5px;color:var(--rc-mute)}
.rcC .grid3 b{display:block;font-family:var(--f-display);font-size:15px;color:var(--rc-ink);white-space:nowrap}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lb{min-width:0}
.set-row .lb b{display:block;font-weight:600}
.set-row .lb small{color:var(--ink-2);font-size:12.5px}
.icon-show{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.icon-show .big{width:132px;height:132px;border-radius:32px;box-shadow:0 24px 40px -16px rgba(140,55,30,.85);animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px) rotate(-2deg)}}
.icon-show .sizes{display:flex;align-items:flex-end;gap:12px}
.icon-show .sizes img{border-radius:22%;box-shadow:var(--shadow)}
.homescreen{display:grid;grid-template-columns:repeat(4,56px);gap:14px 16px;padding:18px;border-radius:24px;background:linear-gradient(160deg,#C9D9F2,#EAD9F2 60%,#FBE0D2);width:max-content;max-width:100%}
.homescreen div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#2d2a33;font-weight:500}
.homescreen span{width:56px;height:56px;border-radius:15px;background:rgba(255,255,255,.55);display:block}
.homescreen img{width:56px;height:56px;border-radius:15px;box-shadow:0 6px 14px -6px rgba(0,0,0,.3)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .plane{display:none}
}

/* ---------- Thai-safe typography: no fixed heights on text, roomy line boxes ---------- */
body{overflow-wrap:break-word}
h1,h2,h3,.ttl,.page-head h1,.hero-scene h1,.trip-hero h1,.pass-txt h2,.j-title,.un-txt b,.ss-head h3,.polaroid b,.stop .nm,.dp-nm,.exp .t,.kv .k,.sum small,.sum b,.kv .v,.est-total b,.day-sum b,.un-head b,.v-head b,.mem-nm b{line-height:1.42}
.bi{line-height:1.4}
.btn{height:auto;min-height:var(--h);padding:6px 18px;line-height:1.35}
.btn-sm{padding:5px 14px}
.btn-icon{padding:0;width:var(--h);min-width:var(--h)}
.chip{height:auto;min-height:30px;padding:4px 12px;line-height:1.4}
.badge{height:auto;min-height:24px;padding:2px 9px;line-height:1.4}
.seg button{height:auto;min-height:34px;padding:5px 14px;line-height:1.35}
.m-chip{height:auto;min-height:24px;padding:2px 9px;line-height:1.4}
.glass-pill{height:auto;min-height:30px;padding:3px 12px;line-height:1.4}
.pick button{height:auto;min-height:42px;padding:5px 14px 5px 6px;line-height:1.35}
.pick button.noav{padding:5px 14px}
.inp{line-height:1.4}
.j-name{line-height:1.45;padding:4px 14px 5px}
.set-row{flex-wrap:wrap}.set-row .lb{flex:1 1 200px}
.kv .k{font-size:12px}
.gauge .pct small{text-shadow:0 0 6px var(--surface)}
.un-acts .btn{flex:1 1 auto;padding:6px 12px}
.tv-body .nm,.dp-row.tv .dp-nm{line-height:1.45}
.toast{line-height:1.45}
/* ---------- members ---------- */
.av.av-art{padding:0;overflow:hidden;background:var(--c)}
.av.av-art svg{width:100%;height:100%;display:block}
.av.xl{width:72px;height:72px;font-size:26px;box-shadow:0 0 0 4px var(--surface),0 10px 22px -10px rgba(90,50,25,.5)}
.mem-prev{display:grid;place-items:center;padding:4px 0 2px}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.av-grid button{display:grid;place-items:center;padding:6px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);transition:transform .25s var(--ease-spring)}
.av-grid button .av{width:40px;height:40px;box-shadow:none}
.av-grid button.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--coral-soft);transform:scale(1.06)}
.swatches.wrap{flex-wrap:wrap}
.mem-list{display:flex;flex-direction:column;gap:6px}
.mem-row{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);text-align:left;color:var(--ink-2)}
.mem-row:hover{border-color:var(--line-2)}
.mem-nm{flex:1;min-width:0;display:flex;flex-direction:column;color:var(--ink)}
.mem-nm small{color:var(--ink-2);font-size:12px}
/* ---------- home money mini ---------- */
.mm-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.mm-top small{display:block;font-size:12px;color:var(--ink-2)}
.mm-top b{font-family:var(--f-display);font-size:22px;line-height:1.35}
.mm-top .r{text-align:right}.mm-top .r b{font-size:16px}
.mm-bar{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden;margin:10px 0 4px}
.mm-bar span{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow 1.1s var(--ease-out) both}
.mm-mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:14px}
.mm-p{display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);text-align:left;color:var(--ink);min-width:0}

/* =========================================================
   PLAN v2 — multi-day text import, per-person budget ranges,
   travel segments, durations, "needs verify", transport calc
   ========================================================= */
const MONTHS={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
const isTravelName=n=>/^\s*(เดินทาง|กลับที่พัก|ออกเดินทาง)/.test(n||'');
function parsePlanFull(text){const items=[],dayTitles={};const pad=n=>String(n).padStart(2,'0');let date=null,cur=null,awaitTitle=false;
  const tre=/^\s*[-•*]?\s*(\d{1,2})[:.](\d{2})\s*(?:น\.?)?\s*(?:(?:[–\-—~]|ถึง)\s*(\d{1,2})[:.](\d{2})\s*(?:น\.?)?)?\s*[|｜:\-–·]?\s*(.*)$/;
  const dre=/^\s*DAY\s*\d+\s*[—\-–:]\s*(?:[A-Za-z]+,?\s*)?(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/i;
  const stop=/^\s*(สรุป|TRANSPORT|TOTAL|APP UI|ข้อมูลทริป|ยอดรวม|แนะนำให้ตั้งงบ|UPDATE TRAVEL|ช่วยเพิ่มรายละเอียด)/i;
  for(const raw of String(text||'').split(/\r?\n/)){const line=raw.trim();if(!line||/^-{3,}$/.test(line))continue;
    const dm=line.match(dre);if(dm&&MONTHS[dm[2].toLowerCase()]){date=dm[3]+'-'+pad(MONTHS[dm[2].toLowerCase()])+'-'+pad(dm[1]);cur=null;awaitTitle=true;continue}
    if(stop.test(line)){cur=null;awaitTitle=false;continue}
    const m=line.match(tre);
    if(m&&+m[1]<24&&+m[2]<60){awaitTitle=false;const name=(m[5]||'').replace(/^[|｜·]\s*/,'').trim()||'—';
      cur={time:pad(m[1])+':'+m[2],endTime:m[3]?pad(m[3])+':'+m[4]:'',name,note:'',date,min:null,max:null,per:'person',verify:false,kind:isTravelName(name)?'travel':'activity'};items.push(cur);continue}
    if(awaitTitle&&date&&!/^[-•*]/.test(line)){dayTitles[date]=line;awaitTitle=false;continue}
    if(!cur)continue;
    const txt=line.replace(/^[-•*]\s*/,'');
    const b=txt.match(/([\d,]+)(?:\s*[–\-]\s*([\d,]+))?\s*บาท(?:\s*\/\s*(คน|คัน|ทริป|กลุ่ม))?/);
    if(b){const lo=+b[1].replace(/,/g,''),hi=b[2]?+b[2].replace(/,/g,''):lo;cur.min=(cur.min||0)+lo*100;cur.max=(cur.max||0)+hi*100;if(b[3]&&b[3]!=='คน')cur.per='group'}
    if(/ตรวจสอบ|ยืนยัน|ตั๋ว|ต้องเช็ก/.test(txt))cur.verify=true;
    cur.note=cur.note?cur.note+'\n'+txt:txt}
  return {items,dayTitles}}
function parsePlan(text){return parsePlanFull(text).items}
const travelersOf=tr=>Math.max(1,+tr.travelers||tr.memberIds.length||1);
const dayNum=(tr,i)=>i+(tr.dayStart===0?0:1);
function estPP(p,tr,any){if(!any&&p.status==='cancelled')return{min:0,max:0};
  if(p.estMin!=null||p.estMax!=null){let lo=p.estMin||0,hi=p.estMax!=null?p.estMax:lo;if(p.estPer==='group'){const n=travelersOf(tr);lo=Math.round(lo/n);hi=Math.round(hi/n)}return{min:lo,max:Math.max(lo,hi)}}
  const v=Math.round((p.estimated||0)/travelersOf(tr));return{min:v,max:v}}
function transportOf(tr,T0,n0){const T=T0||tr.transport;if(!T)return null;const n=n0||travelersOf(tr);
  const pick=(k,act)=>T[act]!=null&&T[act]!==''&&T[act]>0?[T[act],T[act]]:(T[k]||[0,0]);
  let car=pick('car','carActual');const paid=tr.id?preOf(tr.id).filter(e=>e.preKind==='car').reduce((s,e)=>s+e.amount,0):0;
  if(paid&&!(T.carActual>0))car=[Math.max(car[0],paid),Math.max(car[1],paid)];const fuel=pick('fuel','fuelActual'),park=T.parking||[0,0];
  const gmin=car[0]+fuel[0]+park[0],gmax=car[1]+fuel[1]+park[1];return{n,car,fuel,park,gmin,gmax,pmin:Math.round(gmin/n),pmax:Math.round(gmax/n),paid}}
function planEstimate(tr){const days=tripDays(tr);const n=travelersOf(tr);const ex=db.expenses.filter(e=>e.tripId===tr.id);
  const rows=days.map((d,i)=>{let min=0,max=0;db.places.filter(p=>p.tripId===tr.id&&p.date===d).forEach(p=>{const e=estPP(p,tr);min+=e.min;max+=e.max});
    return{date:d,num:dayNum(tr,i),min,max,actual:ex.filter(e=>e.date===d).reduce((s,e)=>s+e.amount,0)}});
  const T=transportOf(tr);const verify=db.places.filter(p=>p.tripId===tr.id&&p.needsVerify&&p.status!=='cancelled').length;
  const preX=preOf(tr.id).filter(e=>e.preKind!=='car'&&e.type!=='personal').reduce((s,e)=>s+e.amount,0);const prePP=Math.round(preX/n);
  const min=rows.reduce((s,r)=>s+r.min,0)+(T?T.pmin:0)+prePP,max=rows.reduce((s,r)=>s+r.max,0)+(T?T.pmax:0)+prePP;
  return{rows,T,n,min,max,verify,prePP,actual:ex.reduce((s,e)=>s+e.amount,0)}}
function rng(a,b,cur){return a===b?money(a,cur):money(a,cur)+'–'+money(b,cur).replace(/^[^\d]+/,'')}
function durMin(p){if(!p.time||!p.endTime)return 0;const [h1,m1]=p.time.split(':').map(Number),[h2,m2]=p.endTime.split(':').map(Number);let d=(h2*60+m2)-(h1*60+m1);if(d<0)d+=1440;return d}
function fmtDur(min){if(!min)return'';const h=Math.floor(min/60),m=min%60;return [h?t('dur.h',{h}):'',m?t('dur.m',{m}):''].filter(Boolean).join(' ')}
const timeRange=p=>(p.time||'—')+(p.endTime?'–'+p.endTime:'');
const firstLine=s=>String(s||'').split('\n')[0];
function estChip(p,tr){const e=estPP(p,tr);return e.max?`<span class="m-chip est num">${rng(e.min,e.max,tr.currency)}${esc(t('unit.pp'))}</span>`:''}
function verifyChip(p){return p.needsVerify?`<button class="m-chip ver" data-act="toggleVerify" data-id="${p.id}" title="${esc(t('badge.verifyHint'))}">${icon('i-alert','sm')}${esc(t('badge.verify'))}</button>`:''}

    <div class="muted tiny">${icon('i-swap','sm')} ${esc(t('pre.note'))}</div></div>`:`<p class="muted tiny" style="margin:0">${esc(t('pre.hint'))}</p>`}

/* ---------- bill photos: IndexedDB (keeps localStorage small) ---------- */
const PH={db:null,urls:{},open(){if(this.db)return this.db;this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('triply-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.db},
 async tx(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const tx=d.transaction('p',mode);const st=tx.objectStore('p');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
 put(id,blob){return this.tx('readwrite',s=>s.put(blob,id))},
 async url(id){if(this.urls[id])return this.urls[id];const b=await this.tx('readonly',s=>s.get(id));if(!b)return null;return this.urls[id]=URL.createObjectURL(b)},
 del(id){if(this.urls[id]){URL.revokeObjectURL(this.urls[id]);delete this.urls[id]}return this.tx('readwrite',s=>s.delete(id)).catch(()=>{})},
 async gc(){try{const keep=new Set();db.expenses.forEach(e=>(e.photos||[]).forEach(p=>keep.add(p)));db.trips.forEach(tr=>(tr.deposits||[]).forEach(d=>(d.photos||[]).forEach(p=>keep.add(p))));
   const keys=await this.tx('readonly',s=>s.getAllKeys());(keys||[]).filter(k=>!keep.has(k)).forEach(k=>this.del(k))}catch(e){}}};
function hydratePhotos(root){$$('img[data-ph]:not([data-ok])',root||document).forEach(img=>{img.dataset.ok='1';PH.url(img.dataset.ph).then(u=>{if(u)img.src=u;else img.closest('.ph')?.classList.add('missing')}).catch(()=>{})})}

function compressImage(file,maxW=1500,q=.8){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
  img.onload=()=>{const sc=Math.min(1,maxW/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};img.src=u})}

function itinerary(tr,c){const days=tripDays(tr);const places=db.places.filter(p=>p.tripId===tr.id);
  const orphan=places.filter(p=>!days.includes(p.date));
  const preTot=preOf(tr.id).reduce((s,e)=>s+e.amount,0);
  const tabs=[{k:'pre',label:t('pre.tab'),sub:preTot?money(preTot,tr.currency):t('pre.tabSub'),cls:'pre'},...days.map((d,i)=>({k:d,label:t('plan.day',{n:dayNum(tr,i)}),sub:fmtDate(d,'dow')}))];if(orphan.length)tabs.push({k:'none',label:t('plan.unscheduled'),sub:orphan.length+''});
  let cur=ui.planDay[tr.id];if(!tabs.some(x=>x.k===cur)){const td=todayStr();cur=days.includes(td)?td:(days[0]||tabs[0].k);ui.planDay[tr.id]=cur}
  const tabBar=`<div class="daytabs" role="tablist">${tabs.map(x=>`<button role="tab" aria-selected="${x.k===cur}" class="daytab ${x.cls||''} ${x.k===cur?'on':''}" data-act="planDay" data-trip="${tr.id}" data-v="${x.k}"><b>${esc(x.label)}</b><small class="${x.k==='pre'&&preTot?'num':''}">${esc(x.sub)}</small></button>`).join('')}</div>`;
  if(cur==='pre')return `<div class="card-h"><div style="min-width:0"><div class="ttl">${L('pre.title')}</div><div class="muted tiny">${esc(t('pre.sub'))}</div></div>
    <div class="row" style="gap:6px;justify-content:flex-end"><button class="btn btn-ghost btn-sm btn-icon" data-act="tripMenu" data-id="${tr.id}" aria-label="${esc(t('menu.more'))}">${icon('i-dots','sm')}</button><button class="btn btn-primary btn-sm" data-act="preAdd" data-trip="${tr.id}" data-v="other">${icon('i-plus','sm')}${esc(t('pre.addShort'))}</button></div></div>${tabBar}${preSection(tr)}`;
  const list=(cur==='none'?orphan:places.filter(p=>p.date===cur)).sort((a,b)=>(a.sort-b.sort)||String(a.time).localeCompare(String(b.time)));
  const dayTotal=list.reduce((s,p)=>s+(c.byPlace[p.id]?.sum||0),0)+(cur!=='none'?c.ex.filter(e=>!e.placeId&&e.date===cur).reduce((s,e)=>s+e.amount,0):0);
  let emin=0,emax=0;list.forEach(p=>{const e=estPP(p,tr);emin+=e.min;emax+=e.max});
  const jv=settings.planView==='journal';const idx=days.indexOf(cur);const dayNo=idx>=0?dayNum(tr,idx):'–';const title=(tr.dayTitles||{})[cur];

function transportForm(tid){const tr=tripById(tid);if(!tr)return;const cur=tr.currency;const T=JSON.parse(JSON.stringify(tr.transport||{car:[0,0],fuel:[0,0],parking:[0,0]}));let n=travelersOf(tr);

function journalDay(tr,c,list,dayNo,date){
  const dest=Nplain(tr,'destination','destAlt')||Nplain(tr);const title=(tr.dayTitles||{})[date];
  if(!list.length)return `<div class="journal"><div class="empty" style="color:#6B655E"><svg class="illo" viewBox="0 0 200 140" style="width:160px"><g filter="url(#wc)" transform="translate(3 2)">${ILLO.pin.wash}</g><g class="inks" filter="url(#rough)">${ILLO.pin.ink}</g></svg><p>${esc(t('j.empty'))}</p><button class="btn btn-primary btn-sm" data-act="pastePlan" data-trip="${tr.id}" data-date="${date||''}">${esc(t('plan.paste'))}</button></div></div>`;
  const acts=[],pre=[];list.forEach(p=>{if(p.kind==='travel'){if(acts.length)acts[acts.length-1].after.push(p);else pre.push(p)}else acts.push({p,after:[]})});
  if(!acts.length){pre.forEach(p=>acts.push({p,after:[]}));pre.length=0}
  const tv=p=>`<button class="j-tv" data-act="openStop" data-id="${p.id}"><svg viewBox="0 0 24 24"><use href="#i-car"/></svg><b class="num">${esc(timeRange(p))}</b> ${esc(Nplain(p))}${fmtDur(durMin(p))?` · ${esc(fmtDur(durMin(p)))}`:''}</button>`;
  let delay=0;const stops=acts.map(({p,after},i)=>{const col=J_COLORS[i%J_COLORS.length],side=i%2?'r':'l';const bp=c.byPlace[p.id];const d=delay;delay+=420;const e=estPP(p,tr);const dm=durMin(p);
    const conn=(i<acts.length-1||after.length)?`<div class="j-conn-wrap"><svg class="j-conn" viewBox="0 0 300 56" preserveAspectRatio="none" style="--d:${d+300}">${side==='l'?'<path class="ink" pathLength="1" d="M70 4 C 70 40, 200 20, 232 50"/><path class="ink" pathLength="1" d="M222 46 L233 51 L232 39"/>':'<path class="ink" pathLength="1" d="M230 4 C 230 40, 100 20, 68 50"/><path class="ink" pathLength="1" d="M78 46 L67 51 L68 39"/>'}</svg>${after.length?`<div class="j-tvs">${after.map(tv).join('')}</div>`:''}</div>`:'';
    return `<div class="j-stop ${side} ${p.status==='cancelled'?'cancelled':''}" style="--d:${d}">
      <div class="j-label"><span class="j-num" style="background:${col}">${i+1}</span><button class="j-name" style="background:${col}" data-act="openStop" data-id="${p.id}">${esc(Nplain(p))}</button></div>
      <div class="j-time num">${esc(timeRange(p))} ${settings.lang==='th'?'น.':''}${dm?`<small>${esc(fmtDur(dm))}</small>`:''}</div>
      <div class="j-body">${p.status==='cancelled'&&p.skip?stickerSVG(p.skip.sticker,'j-stk'):illoSVG(illoOf(p))}<div class="j-note">${p.note?esc(p.note):''}<div class="j-tags">${e.max?`<span class="j-est num">${rng(e.min,e.max,tr.currency)}${esc(t('unit.pp'))}</span>`:''}${p.needsVerify?`<span class="j-ver">${esc(t('badge.verify'))}</span>`:''}${bp?`<span class="j-spent num">${esc(t('plan.actual'))} ${money(bp.sum,tr.currency)}</span>`:''}</div><svg class="j-heart" viewBox="0 0 24 24"><path d="M12 20s-8-4.7-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.3 12 20 12 20z"/></svg></div></div></div>`+conn}).join('');
  let emin=0,emax=0;list.forEach(p=>{const e=estPP(p,tr);emin+=e.min;emax+=e.max});
  return `<div class="journal draw">
   <div class="j-head"><div><div class="j-title">${esc(dest)}<small>${esc(t('plan.day',{n:dayNo}))} · ${esc(fmtDate(date,'short'))}</small></div>${title?`<div class="j-sub">${esc(title)}</div>`:''}<div class="j-brush">${esc(t('j.loading'))} <svg class="j-heart" viewBox="0 0 24 24"><path d="M12 20s-8-4.7-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.3 12 20 12 20z"/></svg></div></div>
    <div class="j-sticky">${esc(t('j.note'))}${emax?`<b class="num">${esc(t('est.dayEst'))}\n${rng(emin,emax,tr.currency)}${esc(t('unit.pp'))}</b>`:''}</div></div>
   <svg class="j-flight" viewBox="0 0 220 60" aria-hidden="true"><path d="M6 52 C 60 54, 90 20, 150 30" fill="none" stroke="#33302E" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 8"/><g class="j-plane" transform="translate(168 18) rotate(-12)"><path d="M-16 4 L14 -2 Q22 -2 16 3 L-14 9Z" fill="#FFFDF7" stroke="#33302E" stroke-width="1.8"/><path d="M-2 2 L-10 -12 L-4 -12 L8 0Z M-2 6 L-8 18 L-2 18 L8 6Z" fill="#FFFDF7" stroke="#33302E" stroke-width="1.8" stroke-linejoin="round"/></g></svg>
   ${pre.length?`<div class="j-tvs top">${pre.map(tv).join('')}</div>`:''}
   <div class="j-stops">${stops}</div>
   <div class="j-foot"><div class="j-check"><b>${esc(t('j.plan'))}</b>${acts.map(({p})=>`<button class="j-ck ${p.status==='visited'?'on':''}" data-act="toggleVisited" data-id="${p.id}"><span class="bx">${p.status==='visited'?'<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>':''}</span>${esc(Nplain(p))}</button>`).join('')}</div>
    <div class="j-polaroid"><img src="${coverSrc(tr)}" alt=""><span>${esc(t('j.letsgo'))}</span></div></div>
   <div class="j-outro">${esc(t('j.outro'))} <svg class="j-heart big" viewBox="0 0 24 24"><path d="M12 20s-8-4.7-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.3 12 20 12 20z"/></svg></div></div>`}

  return{trip:{id,prep:'cnx2026',name:'เชียงใหม่ 18–21 ต.ค.',nameAlt:'チェンマイ 10/18–21',destination:'เชียงใหม่',destAlt:'チェンマイ',start:'2026-10-18',end:'2026-10-21',budget:1500000,currency:'THB',cover:'mountain',

    notes:'ที่พัก Grandview Residence · ถึงสนามบินเชียงใหม่ 18 ต.ค. 23:25 · เข้าที่พัก ~00:30 · บินกลับ 21 ต.ค. 21:00 (ตรวจเวลาในตั๋วจริง) · งบเป้าหมาย 6,500–7,500 บาท/คน + สำรอง 500–1,000 บาท/คน · ไม่รวมตั๋วเครื่องบินและที่พัก'},
   places:P.items.map((it,i)=>placeFromItem(it,id,i))}}
function importPreparedTrip(){const P=parsePlanFull(CNX_TEXT);const old=db.trips.find(x=>x.prep==='cnx2026');const nAct=P.items.filter(i=>i.kind!=='travel').length;
  confirmSheet({title:t('prep.q'),body:t(old?'prep.bodyReplace':'prep.body',{n:nAct,m:P.items.length-nAct}),ok:t('prep.btn'),onOk(){
    let me=db.members.find(m=>m.id===settings.me)||db.members[0];if(!me){me={id:uid('m'),name:t('common.me'),color:MEMBER_COLORS[0]};db.members.push(me);settings.me=me.id}
    let fr=db.members.find(m=>m.name==='เพื่อน');if(!fr){fr={id:uid('m'),name:'เพื่อน',color:MEMBER_COLORS[1]};db.members.push(fr)}
    let id=old?old.id:uid('t');const B=buildCnxTrip(id,old?old.memberIds:[me.id,fr.id]);
    if(old){const gone=new Set(db.places.filter(p=>p.tripId===id).map(p=>p.id));db.places=db.places.filter(p=>!gone.has(p.id));db.expenses.forEach(e=>{if(gone.has(e.placeId))e.placeId=null});Object.assign(old,B.trip,{memberIds:old.memberIds})}
    else db.trips.push(Object.assign({createdAt:new Date().toISOString()},B.trip));
    db.places.push(...B.places);logAct({tripId:id,kind:old?'trip_edit':'trip_add',title:B.trip.name});
    settings.planTrip=id;settings.dashTrip=id;settings.moneyTrip=id;settings.planView='journal';ui.planDay[id]=B.trip.start;saveSettings();persist();sheetStack.slice().forEach(s=>s.close());
    toast(t('prep.done',{n:B.places.length}));go('plan',true);setTimeout(()=>burst(innerWidth/2,innerHeight/3,70),500)}})}

  openSheet({title:esc(t('paste.title')),body,foot:`<button class="btn btn-soft" data-close>${esc(t('form.cancel'))}</button><button class="btn btn-primary" data-save disabled>${esc(t('paste.save'))}</button>`,onMount(sh,api){
    const ta=$('#ppTxt',sh),rep=$('#ppRep',sh);let P={items:[],dayTitles:{}};

      $('#ppPrev',sh).innerHTML=P.items.length?`<b class="tiny">${esc(t('paste.preview',{n:P.items.length}))}</b>`+P.items.map(it=>`<div class="pp-row ${it.kind==='travel'?'tv':''}">${it.kind==='travel'?`<span class="pp-tv">${icon('i-car','sm')}</span>`:illoSVG(guessIllo(it.name)||'pin','mini')}<div style="min-width:0"><b class="num">${it.date?esc(fmtDate(it.date,'short'))+' · ':''}${esc(it.time)}${it.endTime?'–'+esc(it.endTime):''}</b> ${esc(it.name)}${it.min!=null?` <span class="m-chip est num">${rng(it.min,it.max,tr.currency)}${esc(t('unit.pp'))}</span>`:''}${it.verify?` <span class="m-chip ver">${esc(t('badge.verify'))}</span>`:''}${it.note?`<small>${esc(firstLine(it.note))}</small>`:''}</div></div>`).join(''):(ta.value.trim()?`<span class="err">${esc(t('paste.none'))}</span>`:'')};
    ta.addEventListener('input',upd);if(prefill){ta.value=prefill;upd()}rep.onclick=()=>rep.setAttribute('aria-checked',rep.getAttribute('aria-checked')!=='true');
    $('#ppPrep',sh).onclick=()=>{api.close();setTimeout(importPreparedTrip,300)};
    $('[data-save]',sh).onclick=()=>{if(!P.items.length)return;const d0=$('#ppDay',sh).value;P.items.forEach(it=>{if(!it.date)it.date=d0});
      const dates=[...new Set(P.items.map(i=>i.date))].sort();if(dates[0]<tr.start)tr.start=dates[0];if(dates[dates.length-1]>tr.end)tr.end=dates[dates.length-1];
      if(rep.getAttribute('aria-checked')==='true'){const gone=new Set(db.places.filter(p=>p.tripId===tripId&&dates.includes(p.date)).map(p=>p.id));db.places=db.places.filter(p=>!gone.has(p.id));db.expenses.forEach(e=>{if(gone.has(e.placeId))e.placeId=null})}
      dates.forEach(d=>{let s=Math.max(0,...db.places.filter(p=>p.tripId===tripId&&p.date===d).map(p=>p.sort||0));P.items.filter(i=>i.date===d).forEach(it=>{const pl=placeFromItem(it,tripId,s++,d);db.places.push(pl)})});
      tr.dayTitles=Object.assign(tr.dayTitles||{},P.dayTitles);
      logAct({tripId,kind:'place_add',title:P.items.filter(i=>i.kind!=='travel').map(i=>i.name).slice(0,2).join(', ')+(P.items.length>2?' …':'')});
      ui.planDay[tripId]=dates[0];settings.planTrip=tripId;settings.planView='journal';saveSettings();api.close();persist();toast(t('paste.done',{n:P.items.length}));if(route!=='plan')go('plan');else render(true)}}})}

function splitEqual(total,ids){const n=ids.length;if(!n)return[];const base=Math.floor(total/n);let rem=total-base*n;
  return ids.map(id=>({memberId:id,amount:base+(rem-->0?1:0)}))}
function splitPercent(total,rows){ // rows [{memberId,pct}] pct sum 100
  const raw=rows.map(r=>({memberId:r.memberId,pct:r.pct,exact:total*r.pct/100}));
  raw.forEach(r=>{r.amount=Math.floor(r.exact);r.frac=r.exact-r.amount});
  let rem=total-raw.reduce((s,r)=>s+r.amount,0);
  [...raw].sort((a,b)=>b.frac-a.frac).forEach(r=>{if(rem>0){r.amount++;rem--}});
  return raw.map(r=>({memberId:r.memberId,amount:r.amount,pct:r.pct}))}
function optimizeTransfers(netMap){
  const cred=[],debt=[];Object.entries(netMap).forEach(([id,v])=>{if(v>0)cred.push({id,v});else if(v<0)debt.push({id,v:-v})});
  cred.sort((a,b)=>b.v-a.v);debt.sort((a,b)=>b.v-a.v);const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const a=Math.min(debt[i].v,cred[j].v);if(a>0)out.push({from:debt[i].id,to:cred[j].id,amount:a});
    debt[i].v-=a;cred[j].v-=a;if(debt[i].v===0)i++;if(cred[j].v===0)j++}
  return out}
function computeTrip(tid){
  const trip=tripById(tid);if(!trip)return null;
  const ex=db.expenses.filter(e=>e.tripId===tid);
  const ids=new Set(trip.memberIds);ex.forEach(e=>{ids.add(e.payerId);e.shares.forEach(s=>ids.add(s.memberId))});
  const per={};ids.forEach(id=>per[id]={paid:0,paidShared:0,owed:0,personal:0,sent:0,recv:0,net:0,depAdj:0});
  (trip.deposits||[]).forEach(d=>{if(d.status==='refunded'&&d.refundTo&&d.refundTo!==d.payerId&&d.refundAmt>0){(per[d.payerId]||(per[d.payerId]={paid:0,paidShared:0,owed:0,personal:0,sent:0,recv:0,net:0,depAdj:0})).depAdj+=d.refundAmt;(per[d.refundTo]||(per[d.refundTo]={paid:0,paidShared:0,owed:0,personal:0,sent:0,recv:0,net:0,depAdj:0})).depAdj-=d.refundAmt}});
  let total=0,shared=0,personal=0;const byCat={},byPlace={},byDay={};
  ex.forEach(e=>{total+=e.amount;byCat[e.category]=(byCat[e.category]||0)+e.amount;byDay[e.date]=(byDay[e.date]||0)+e.amount;
    if(e.placeId){const b=byPlace[e.placeId]||(byPlace[e.placeId]={sum:0,n:0,payers:new Set()});b.sum+=e.amount;b.n++;b.payers.add(e.payerId)}
    const p=per[e.payerId];p.paid+=e.amount;
