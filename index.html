    else{shared+=e.amount;p.paidShared+=e.amount;e.shares.forEach(s=>per[s.memberId].owed+=s.amount)}});
  const setts=db.settlements.filter(s=>s.tripId===tid);
  setts.filter(s=>s.status==='paid').forEach(s=>{if(per[s.from])per[s.from].sent+=s.amount;if(per[s.to])per[s.to].recv+=s.amount});
  const netMap={};Object.entries(per).forEach(([id,p])=>{p.net=p.paidShared-p.owed+p.sent-p.recv+(p.depAdj||0);p.resp=p.owed+p.personal;netMap[id]=p.net});
  const transfers=optimizeTransfers(netMap);
  return {trip,ex,per,memberIds:[...ids],total,shared,personal,byCat,byPlace,byDay,transfers,setts,
    remaining:trip.budget-total,pct:trip.budget>0?total/trip.budget*100:0};
}

function globalOwes(){const by={};db.trips.forEach(tr=>{const c=computeTrip(tr.id);if(!c||!c.transfers.length)return;const o=by[tr.currency]||(by[tr.currency]={net:{},trips:[]});
  Object.entries(c.per).forEach(([id,p])=>o.net[id]=(o.net[id]||0)+p.net);o.trips.push({tr,transfers:c.transfers})});
  return Object.entries(by).map(([cur,o])=>({cur,transfers:optimizeTransfers(o.net),trips:o.trips}))}

/* ---------- home: focus trip/day, up next, day plan ---------- */
function focusTrip(){const s=sortedTrips().filter(x=>tripStatus(x)!=='completed');return s[0]||tripById(resolveTrip('dashTrip'))}
function focusDay(tr){const days=tripDays(tr);if(!days.length)return null;const td=todayStr();let d=ui.homeDay[tr.id];if(days.includes(d))return d;if(days.includes(td))return td;return days[0]}
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const toMin=s=>{if(!s)return 0;const [h,m]=s.split(':').map(Number);return h*60+m};
function dayList(tr,d){return db.places.filter(p=>p.tripId===tr.id&&p.date===d).sort((a,b)=>(a.sort-b.sort)||String(a.time).localeCompare(String(b.time)))}
function upNextCard(tr){const d=focusDay(tr);if(!d)return'';const list=dayList(tr,d);const isToday=d===todayStr();const acts=list.filter(p=>p.kind!=='travel');
  const n=isToday?nowMin():-1;let nxt=acts.find(p=>p.status==='planned'&&(!isToday||toMin(p.endTime||p.time)+(toMin(p.endTime)<toMin(p.time)?1440:0)>=n))||acts.find(p=>p.status==='planned');
  const days=tripDays(tr);const idx=days.indexOf(d);const before=todayStr()<tr.start?daysBetween(todayStr(),tr.start):0;
  const head=`<div class="un-head"><div><small>${before?esc(t('un.before',{n:before})):esc(t('un.today'))}</small><b>${esc(Nplain(tr))}</b></div><span class="badge ${STATUS_BADGE[tripStatus(tr)]}">${esc(t('status.'+tripStatus(tr)))}</span></div>`;
  if(!nxt)return `<div class="card upnext rv" style="--i:2">${head}<div class="un-done">${stickerSVG('lantern','md')}<p>${esc(t('un.allDone'))}</p></div></div>`;
  const st=toMin(nxt.time),left=isToday?st-n:null;const e=estPP(nxt,tr);
  return `<div class="card upnext rv" style="--i:2">${head}
   <button class="un-main" data-act="openStop" data-id="${nxt.id}"><div class="un-art">${illoSVG(illoOf(nxt))}</div><div class="un-txt"><small>${esc(t('un.next'))} · ${esc(t('plan.day',{n:dayNum(tr,idx)}))}</small><b>${esc(Nplain(nxt))}</b>
    <span class="un-time num">${esc(timeRange(nxt))}${durMin(nxt)?` · ${esc(fmtDur(durMin(nxt)))}`:''}</span>${left!=null&&left>0?`<span class="un-left">${esc(t('un.in',{x:fmtDur(left)}))}</span>`:left!=null&&left<=0?`<span class="un-left now">${esc(t('un.now'))}</span>`:''}
    <span class="m-row">${e.max?`<span class="m-chip est num">${rng(e.min,e.max,tr.currency)}${esc(t('unit.pp'))}</span>`:''}${nxt.needsVerify?`<span class="m-chip ver">${esc(t('badge.verify'))}</span>`:''}</span></div></button>
   <div class="un-acts"><a class="btn btn-primary btn-sm" href="${navURL(nxt,tr)}" target="_blank" rel="noopener">${icon('i-nav','sm')}${esc(t('stop.nav'))}</a><button class="btn btn-soft btn-sm" data-act="openStop" data-id="${nxt.id}">${icon('i-wallet','sm')}${esc(t('stop.addExp'))}</button><button class="btn btn-soft btn-sm" data-act="markDone" data-id="${nxt.id}">${icon('i-check','sm')}${esc(t('stop.done'))}</button></div></div>`}
function dayPlanCard(tr){const d=focusDay(tr);if(!d)return'';const days=tripDays(tr);const list=dayList(tr,d);const c=computeTrip(tr.id);
  return `<div class="card dayplan rv" style="--i:3"><div class="card-h"><div><div class="ttl">${L('dp.title')}</div><div class="muted tiny">${esc((tr.dayTitles||{})[d]||fmtDate(d,'long'))}</div></div><button class="btn btn-ghost btn-sm" data-act="openTrip" data-id="${tr.id}">${esc(t('dp.all'))}${icon('i-arrow','sm')}</button></div>
   <div class="chips dp-days">${days.map((x,i)=>`<button class="chip ${x===d?'on':''}" data-act="homeDay" data-trip="${tr.id}" data-v="${x}">${esc(t('plan.day',{n:dayNum(tr,i)}))} · ${esc(fmtDate(x,'short'))}</button>`).join('')}</div>
   ${list.length?`<div class="dp-list">${list.map(p=>{const bp=c.byPlace[p.id];
     if(p.kind==='travel')return `<button class="dp-row tv ${p.status}" data-act="openStop" data-id="${p.id}"><span class="dp-tm num">${esc(p.time)}</span><span class="dp-dot tv">${icon('i-car','sm')}</span><span class="dp-nm">${esc(Nplain(p))}${durMin(p)?` · ${esc(fmtDur(durMin(p)))}`:''}</span></button>`;
     return `<div class="dp-row ${p.status}"><span class="dp-tm num">${esc(p.time)}${p.endTime?`<small>${esc(p.endTime)}</small>`:''}</span>
      <button class="dp-main" data-act="openStop" data-id="${p.id}">${p.status==='cancelled'&&p.skip?stickerSVG(p.skip.sticker,'dp-art'):illoSVG(illoOf(p),'dp-art')}<span class="dp-body"><span class="dp-nm">${esc(Nplain(p))}</span>
       <span class="dp-meta">${p.status==='cancelled'&&p.skip?`<span class="dp-why">${esc(p.skip.note||t('skip.noReason'))}</span>`:''}${p.status!=='cancelled'&&estPP(p,tr).max?`<span class="num">${rng(estPP(p,tr).min,estPP(p,tr).max,tr.currency)}${esc(t('unit.pp'))}</span>`:''}${bp?`<span class="num paid">${esc(t('plan.actual'))} ${money(bp.sum,tr.currency)}</span>`:''}</span></span></button>
      <span class="dp-acts"><button class="tick ${p.status==='visited'?'on':''}" data-act="markDone" data-id="${p.id}" aria-label="${esc(t('stop.done'))}">${icon('i-check','sm')}</button><button class="cross ${p.status==='cancelled'?'on':''}" data-act="skipStop" data-id="${p.id}" aria-label="${esc(t('stop.skip'))}">${icon('i-x','sm')}</button></span></div>`}).join('')}</div>`
   :`<div class="empty"><p>${esc(t('plan.emptyDay'))}</p><button class="btn btn-soft btn-sm" data-act="pastePlan" data-trip="${tr.id}" data-date="${d}">${esc(t('plan.paste'))}</button></div>`}</div>`}

    <div class="ss-quick"><div class="amount-inp sm"><span>${SYM[tr.currency]||''}</span><input id="qAmt" inputmode="decimal" placeholder="0" aria-label="${esc(t('form.amount'))}"></div>
     <input class="inp" id="qTitle" value="${esc(Nplain(p).replace(/\s*—.*$/,''))}" aria-label="${esc(t('form.title'))}">
     <span class="flabel">${esc(t('form.payer'))}</span><div class="pick" id="qPayer">${mem.map(m=>`<button type="button" class="${m.id===payer0?'on':''}" data-v="${m.id}">${av(m,'sm')}${esc(m.name)}</button>`).join('')}</div>
     <div class="seg" id="qType"><button type="button" class="on" data-v="shared">${icon('i-users','sm')} ${esc(t('stop.splitAll',{n:mem.length}))}</button><button type="button" data-v="personal">${esc(t('form.typePersonal'))}</button></div>
     <div class="row" style="gap:8px"><button class="btn btn-primary" data-ss="save" style="flex:1" disabled>${icon('i-plus','sm')}${esc(t('stop.saveExp'))}</button><button class="btn btn-ghost btn-sm" data-ss="full">${esc(t('stop.fullForm'))}</button></div></div></div>`;
  openSheet({title:esc(t('stop.title')),body,foot:`<button class="btn btn-ghost btn-sm" data-ss="edit" style="flex:none">${icon('i-edit','sm')}${esc(t('plan.edit'))}</button><button class="btn btn-soft" data-close>${esc(t('common.close'))}</button>`,onMount(sh,api){

    sh.addEventListener('click',ev=>{const b=ev.target.closest('[data-ss]');if(ev.target.closest('[data-act="editExpense"]')){api.close();return}if(!b)return;const a=b.dataset.ss;
      if(a==='done'){p.status=p.status==='visited'?'planned':'visited';if(p.status==='visited'){delete p.skip;celebrate(b)}api.close();commit()}
      else if(a==='skip'){if(p.status==='cancelled'){p.status='planned';delete p.skip;api.close();commit()}else{api.close();setTimeout(()=>skipSheet(p.id),280)}}

   <div class="err" id="mErr" role="alert"></div>`;
  openSheet({title:esc(ex?t('mem.edit'):t('mem.new')),small:true,body,foot:`${ex?`<button class="btn btn-danger btn-icon" data-del style="flex:none" aria-label="${esc(t('plan.delete'))}">${icon('i-trash')}</button>`:''}<button class="btn btn-soft" data-close>${esc(t('form.cancel'))}</button><button class="btn btn-primary" data-save>${esc(t('form.save'))}</button>`,onMount(sh,api){
    const prev=()=>{st.name=$('#mName',sh).value;$('#mPrev',sh).innerHTML=av(st,'xl');$$('#mAv .av',sh).forEach(a=>a.style.setProperty('--c',st.color));const f=$('#mAv button[data-v=""] .av',sh);if(f)f.textContent=(st.name||'A').trim().slice(0,1).toUpperCase()};

    $('#mAcct',sh).onblur=e=>{e.target.value=fmtAcct(e.target.value,st.bank)};
    $('#mAv',sh).onclick=e=>{const b=e.target.closest('button');if(!b)return;st.avatar=b.dataset.v;$$('#mAv button',sh).forEach(x=>x.classList.toggle('on',x===b));haptic(6);prev()};
    $('#mCol',sh).onclick=e=>{const b=e.target.closest('button');if(!b)return;st.color=b.dataset.v;$$('#mCol button',sh).forEach(x=>x.classList.toggle('on',x===b));prev()};
    $('[data-save]',sh).onclick=()=>{const name=$('#mName',sh).value.trim();if(!name){$('#mErr',sh).textContent=t('mem.errName');return}
      const acct=digits($('#mAcct',sh).value);if(acct&&!st.bank){$('#mErr',sh).textContent=t('acct.errBank');return}
      const bk={bank:acct?st.bank:'',acct,acctName:$('#mAcctName',sh).value.trim(),pp:digits($('#mPP',sh).value)};
      let m=ex;if(m)Object.assign(m,{name,color:st.color,avatar:st.avatar||''},bk);else{m=Object.assign({id:uid('m'),name,color:st.color,avatar:st.avatar||''},bk);db.members.push(m)}
      api.close();commit();toast(t('toast.saved'));onDone&&onDone(m)};
    const del=$('[data-del]',sh);if(del)del.onclick=()=>{const r=memberRefs(ex.id);if(r.exp){$('#mErr',sh).textContent=t('mem.inUse',{n:ex.name});return}
      if(db.members.length<=1){$('#mErr',sh).textContent=t('mem.last');return}
      confirmSheet({title:t('mem.delQ',{n:ex.name}),body:r.trips.length?t('mem.delTrips',{n:r.trips.length}):t('mem.delBody'),ok:t('common.yesDelete'),danger:true,onOk(){
        db.trips.forEach(tr=>{tr.memberIds=tr.memberIds.filter(x=>x!==ex.id)});db.members=db.members.filter(x=>x.id!==ex.id);if(settings.me===ex.id){settings.me=db.members[0].id;saveSettings()}api.close();commit();toast(t('toast.deleted'))}})}}})}

/* ---------- home money summary (one compact card) ---------- */
function moneyMini(c){const tr=c.trip,cur=tr.currency;const pct=tr.budget?Math.min(100,c.total/tr.budget*100):0;const over=tr.budget&&c.total>tr.budget;const ids=c.memberIds;
  return `<div class="card mm rv" style="--i:4"><div class="card-h"><div><div class="ttl">${L('mm.title')}</div><div class="muted tiny">${esc(Nplain(tr))}</div></div><button class="btn btn-ghost btn-sm" data-act="go" data-v="money">${esc(t('mm.more'))}${icon('i-arrow','sm')}</button></div>
   <div class="mm-top"><div><small>${esc(t('budget.spent'))}</small><b class="num" data-count="${c.total}" data-cur="${cur}" data-key="mm-${tr.id}">${money(c.total,cur)}</b></div><div class="r"><small>${esc(over?t('budget.over'):t('budget.remaining'))}</small><b class="num" style="color:${over?'var(--bad)':'var(--ok)'}">${money(Math.abs(c.remaining),cur)}</b></div></div>
   ${tr.budget?`<div class="mm-bar"><span style="width:${pct}%;background:${pct>=100?'var(--bad)':pct>=80?'var(--warn)':'var(--ok)'}"></span></div><div class="muted tiny num">${Math.round(c.total/tr.budget*100)}% · ${esc(t('budget.total'))} ${money(tr.budget,cur)}</div>`:''}
   ${(()=>{const pl=preOf(tr.id);if(!pl.length)return '';const sum=pl.reduce((s,e)=>s+e.amount,0);return `<button class="mm-pre" data-act="goPre" data-id="${tr.id}">${icon('i-plane','sm')}<span>${esc(t('pre.mm'))}<small>${esc(t('pre.items',{n:pl.length}))}</small></span><b class="num">${money(sum,cur)}</b>${icon('i-arrow','sm')}</button>`})()}
   <div class="mm-mem">${ids.map(id=>{const m=memberById(id),p=c.per[id];return `<button class="mm-p" data-act="memberDetail" data-id="${id}" data-trip="${tr.id}">${av(m,'sm')}<span><b>${esc(m.name)}</b><small class="num">${esc(t('paid.paid'))} ${money(p.paid,cur)}</small></span></button>`}).join('')}</div></div>`}

/* ---------- device / install environment ---------- */
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const coarse=matchMedia('(pointer:coarse)').matches;
let installEvt=null;

addEventListener('appinstalled',()=>{installEvt=null;toast(t('install.done'));render(false)});
const canInstall=()=>!inFrame&&!isStandalone()&&(installEvt||isIOS);
function haptic(ms=10){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function installBanner(){if(!canInstall()||store.get('triply.installDismissed'))return'';
  return `<div class="install rv" style="--i:0"><img src="${ICON_URL}" alt=""><div style="min-width:0"><b>${esc(t('install.title'))}</b><small>${esc(t('install.sub'))}</small></div>

async function doInstall(){if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render(false);return}
  openSheet({title:esc(t('install.iosTitle')),small:true,body:`<div class="row" style="gap:14px;flex-wrap:nowrap"><img src="${ICON_URL}" alt="" style="width:60px;height:60px;border-radius:16px"><div><b>Triply</b><div class="muted tiny">${esc(t('install.sub'))}</div></div></div>
   <ol class="ios-steps"><li><span>${esc(t('install.ios1'))} ${icon('i-share','sm')}</span></li><li>${esc(t('install.ios2'))}</li><li>${esc(t('install.ios3'))}</li></ol>`})}
function toast(msg,kind='ok',undo){const el=document.createElement('div');el.className='toast';
  const ic={ok:['var(--ok-bg)','var(--ok)','i-check'],warn:['var(--warn-bg)','var(--warn)','i-alert'],bad:['var(--bad-bg)','var(--bad)','i-alert'],info:['var(--blue)','var(--blue-ink)','i-heart']}[kind]||[];
  el.innerHTML=`<span class="ic" style="background:${ic[0]};color:${ic[1]}">${icon(ic[2])}</span><span>${esc(msg)}</span>${undo?`<button class="undo">${esc(t('common.undo'))}</button>`:''}`;
  $('#toasts').appendChild(el);if(undo)el.querySelector('.undo').onclick=()=>{undo();close()};
  let tm=setTimeout(close,undo?5200:2800);function close(){clearTimeout(tm);el.classList.add('out');setTimeout(()=>el.remove(),300)}}
let sheetStack=[];
function openSheet({title,body,foot,small,onMount,onClose}){
  const scrim=document.createElement('div');scrim.className='scrim';const sh=document.createElement('div');sh.className='sheet'+(small?' small':'');
  sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-label',title);
  sh.innerHTML=`<div class="grab"></div><div class="sh"><h3>${title}</h3><button class="btn btn-ghost btn-sm btn-icon" data-close aria-label="${esc(t('common.close'))}">${icon('i-x')}</button></div><div class="sb">${body}</div>${foot?`<div class="sf">${foot}</div>`:''}`;
  document.body.append(scrim,sh);requestAnimationFrame(()=>{scrim.classList.add('show');sh.classList.add('show')});
  const api={el:sh,close(){scrim.classList.remove('show');sh.classList.remove('show');setTimeout(()=>{scrim.remove();sh.remove()},450);sheetStack=sheetStack.filter(x=>x!==api);onClose&&onClose()}};
  scrim.onclick=api.close;sh.querySelectorAll('[data-close]').forEach(b=>b.onclick=api.close);sheetStack.push(api);
  // swipe down to close (phone)
  const handle=[sh.querySelector('.grab'),sh.querySelector('.sh')];let y0=null,dy=0;
  handle.forEach(h=>{h.addEventListener('pointerdown',e=>{if(innerWidth>880||e.target.closest('button'))return;y0=e.clientY;dy=0;sh.classList.add('dragging');h.setPointerCapture(e.pointerId)});
    h.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translate(-50%,${dy}px)`;scrim.style.opacity=String(1-Math.min(.8,dy/400))});
    const end=()=>{if(y0==null)return;y0=null;sh.classList.remove('dragging');sh.style.transform='';scrim.style.opacity='';if(dy>110){haptic(8);api.close()}};
    h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)});
  handle.forEach(h=>h&&(h.style.touchAction='none'));
  onMount&&onMount(sh,api);setTimeout(()=>{const f=sh.querySelector('[autofocus]');f&&f.focus()},350);return api}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetStack.length)sheetStack[sheetStack.length-1].close()});
function confirmSheet({title,body,ok,danger,onOk}){openSheet({title:esc(title),small:true,body:`<p style="margin:0" class="muted">${esc(body)}</p>`,
  foot:`<button class="btn btn-soft" data-close>${esc(t('form.cancel'))}</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-ok>${esc(ok||t('common.confirm'))}</button>`,
  onMount(sh,api){sh.querySelector('[data-ok]').onclick=()=>{api.close();onOk()}}})}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.fab');if(!b||reduce)return;const r=b.getBoundingClientRect();const s=Math.max(r.width,r.height)*2;

function rxBarcode(seed){let h=0;for(const ch of String(seed))h=(h*31+ch.charCodeAt(0))>>>0;let x=0,out='';while(x<296){h=(h*1103515245+12345)>>>0;const w=1+(h>>>29)%3,g=1+(h>>>26)%2;out+=`<rect x="${x}" y="0" width="${w}" height="44"/>`;x+=w+g}return svgURL(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 44" preserveAspectRatio="none"><g fill="#23324A">${out}</g></svg>`)}
function fitText(root){$$('.ft',root).forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize)||14;const min=Math.max(8,fs*.55);let g=0;
  while(el.scrollWidth>el.clientWidth+.5&&fs>min&&g++<40){fs-=.5;el.style.fontSize=fs+'px'}})}

    :`<div class="rx-kpis"><div><small class="ft">${esc(T('rx.budget'))}</small><b class="ft">${tr.budget?M(tr.budget):'—'}</b></div><div><small class="ft">${esc(T(c.remaining<0?'r.over':'rx.left'))}</small><b class="ft ${c.remaining<0?'neg':'pos'}">${tr.budget?M(Math.abs(c.remaining)):'—'}</b></div><div><small class="ft">${esc(T('rx.pp'))}</small><b class="ft">${M(Math.round(c.shared/n))}</b></div></div>`;
  const catHex=k=>(CAT_META[k]||CAT_META.other).hex;const catBg=k=>{const h=catHex(k).slice(1);return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},.24)`};

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function promptPayPayload(target,amount){const d=digits(target);let acc;
  if(d.length>=15)acc=tlv('03',d);else if(d.length>=13)acc=tlv('02',d);else acc=tlv('01',('0000000000000'+d.replace(/^0/,'66')).slice(-13));
  let p=tlv('00','01')+tlv('01',amount?'12':'11')+tlv('29',tlv('00','A000000677010111')+acc)+tlv('53','764')+(amount?tlv('54',(amount/100).toFixed(2)):'')+tlv('58','TH');
  p+='6304';return p+crc16(p)}
function qrSVG(text,fg='#1E1E1E'){if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),pad=2,sz=n+pad*2;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+pad} ${r+pad}h1v1h-1z`;
  return svgURL(`<svg xmlns="http://www.w3.org/2000/svg" width="${sz*12}" height="${sz*12}" viewBox="0 0 ${sz} ${sz}" shape-rendering="crispEdges"><rect width="${sz}" height="${sz}" fill="#FFF"/><path d="${d}" fill="${fg}"/></svg>`)}

  const measure=html=>{mbox.innerHTML=`<div class="rxb">${html}</div>`;fitText(mbox);return mbox.firstChild.getBoundingClientRect().height};

  newCol();col.push(P.head+`<div class="rxp-sum">${P.summary}</div>`);used=headH;

    if(used+need>cap&&used>0){newCol();if(isItem&&!b.kind.first){pre=`<section class="rx-sec rx-items cont">${b.kind.dh}</section>`;need=b.h+(contH[b.kind.day]??(contH[b.kind.day]=measure(pre)))}}
    col.push(pre+b.html);used+=need;if(isItem)curDay=b.kind.day;

  finally{host.remove()}}

  if(mode==='pdf'){const J=window.jspdf?.jsPDF;if(!J)throw new Error('nopdf');const pdf=new J({orientation:'landscape',unit:'px',format:[RXP.W,RXP.H],hotfixes:['px_scaling']});cvs.forEach((cv,i)=>{if(i)pdf.addPage([RXP.W,RXP.H],'landscape');pdf.addImage(cv.toDataURL('image/png'),'PNG',0,0,RXP.W,RXP.H)});await offerFile(fileBase()+'.pdf',pdf.output('blob'),cvs[0].toDataURL('image/png'));return}
  imagesSheet({canvases:cvs,base:fileBase(),text:summaryText(),title:t('rc.view')})}catch(e){console.error(e);toast(t('rc.exportFail'),'bad')}finally{busy(btn,false)}}

function updateReceipt(reprint){const cap=$('#receiptCapture');if(!cap)return;const c=computeTrip(resolveTrip('rcTrip'));if(c.ex.length){cap.innerHTML=receiptMarkup(c);fitText(cap)}
  const f=$('#feed');if(reprint&&f){f.classList.remove('printing');void f.offsetWidth;f.classList.add('printing')}else if(f)f.classList.remove('printing');
  if(!reprint)$$('.stamp-anim',cap).forEach(s=>s.classList.remove('stamp-anim'))}
async function captureReceipt(){const el=$('#receiptCapture');if(!el||typeof html2canvas!=='function')throw new Error('nolib');
  const feed=$('#feed');feed.classList.remove('printing');el.classList.add('capturing');fitText(el);
  const swaps=[];
  try{await document.fonts.ready;await Promise.all($$('img',el).map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
   for(const img of $$('img.cover',el)){const w=img.clientWidth,h=img.clientHeight;if(!w||!h)continue;const k=3;const cv=document.createElement('canvas');cv.width=w*k;cv.height=h*k;
    const isSvg=img.src.startsWith('data:image/svg');const iw=isSvg?400:(img.naturalWidth||400),ih=isSvg?240:(img.naturalHeight||240);const sc=Math.max(cv.width/iw,cv.height/ih);const dw=iw*sc,dh=ih*sc;cv.getContext('2d').drawImage(img,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);
    swaps.push([img,img.src]);img.src=cv.toDataURL('image/png');await img.decode().catch(()=>{})}
   return await html2canvas(el,{backgroundColor:'#EFEBDF',scale:Math.min(3,Math.max(2,devicePixelRatio||2)),logging:false,useCORS:true})}
  finally{swaps.forEach(([img,src])=>img.src=src);el.classList.remove('capturing')}}
let dlApi;async function getDownloads(){if(dlApi!==undefined)return dlApi;try{dlApi=window.claude?.use?await window.claude.use('downloads'):null}catch(e){dlApi=null}return dlApi}
async function offerFile(filename,data,previewURL,mime){const d=await getDownloads();
  if(d){try{await d.save({filename,data});toast(t('rc.saved'));return true}catch(e){if(e?.code==='declined'){toast(t('rc.declined'),'info');return false}if(e?.code==='rate_limited')return false}}
  if(!inFrame){ // installed app / normal browser: share sheet on phones, download link elsewhere
    const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
    try{const file=new File([blob],filename,{type:blob.type||mime});
      if(coarse&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true}}catch(e){if(e&&e.name==='AbortError')return false}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast(t('rc.saved'));return true}catch(e){}}
  if(previewURL){openSheet({title:esc(t('rc.fallbackTitle')),body:`<p class="muted" style="margin:0">${esc(t('rc.fallback'))}</p><img src="${previewURL}" alt="receipt" style="width:100%;border-radius:16px;box-shadow:var(--shadow)">`})}return false}
const fileBase=()=>{const tr=tripById(resolveTrip('rcTrip'));return 'triply-'+(tr?.name||'trip').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'-').slice(0,40)}
async function viewRc(btn){if(rcLand())return exportLand(btn&&btn.tagName==='BUTTON'?btn:null);if(viewRc.busy)return;viewRc.busy=true;try{const cv=await captureReceipt();imageSheet({canvas:cv,filename:fileBase()+'.png',text:summaryText(),title:t('rc.view')})}catch(e){console.error(e);toast(t('rc.exportFail'),'bad')}finally{viewRc.busy=false}}
async function exportPNG(btn){if(rcLand())return exportLand(btn);busy(btn,true);try{const cv=await captureReceipt();if(!(await getDownloads())&&coarse){imageSheet({canvas:cv,filename:fileBase()+'.png',text:summaryText(),title:t('rc.png')});return}const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const url=cv.toDataURL('image/png');await offerFile(fileBase()+'.png',blob,url);burst(innerWidth/2,innerHeight/2,40)}
  catch(e){console.error(e);toast(t('rc.exportFail'),'bad')}finally{busy(btn,false)}}
async function exportPDF(btn){if(rcLand())return exportLand(btn,'pdf');busy(btn,true);try{const cv=await captureReceipt();const J=window.jspdf?.jsPDF;if(!J)throw new Error('nopdf');
  const w=cv.width/2,h=cv.height/2;const pdf=new J({orientation:h>w?'portrait':'landscape',unit:'px',format:[w,h],hotfixes:['px_scaling']});pdf.addImage(cv.toDataURL('image/png'),'PNG',0,0,w,h);
  const blob=pdf.output('blob');await offerFile(fileBase()+'.pdf',blob,cv.toDataURL('image/png'))}catch(e){console.error(e);toast(t('rc.exportFail'),'bad')}finally{busy(btn,false)}}
async function shareRc(btn){if(rcLand())return exportLand(btn);busy(btn,true);try{const cv=await captureReceipt();imageSheet({canvas:cv,filename:fileBase()+'.png',text:summaryText(),title:t('rc.share')});return;const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],fileBase()+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:summaryText()});return}catch(e){}}
  toast(t('rc.shareHint'),'info');await offerFile(fileBase()+'.png',blob,cv.toDataURL('image/png'))}catch(e){toast(t('rc.exportFail'),'bad')}finally{busy(btn,false)}}
function busy(btn,on){if(!btn)return;btn.disabled=on;if(on){btn.dataset.lbl=btn.innerHTML;btn.innerHTML=`<span class="muted">${esc(t('rc.exporting'))}</span>`}else if(btn.dataset.lbl)btn.innerHTML=btn.dataset.lbl}
function summaryText(){const c=computeTrip(resolveTrip('rcTrip'));const tr=c.trip,cur=tr.currency,{p:lp}=rcLangs();const M=v=>money(v,cur);
  const L2=k=>t(k,null,lp);let s=`✈ ${Nplain(tr)} (${fmtRange(tr.start,tr.end,lp)})\n${L2('r.spent')}: ${M(c.total)} / ${L2('r.budget')} ${M(tr.budget)}\n${L2('r.perPerson')}: ${M(Math.round(c.total/Math.max(1,tr.memberIds.length)))}\n\n`;
  s+=CATS.filter(k=>c.byCat[k]).map(k=>`• ${L2('cat.'+k)} ${M(c.byCat[k])}`).join('\n')+'\n\n';
  s+=c.memberIds.map(id=>{const m=memberById(id),p=c.per[id];return `${m.name}: ${L2('r.paid')} ${M(p.paid)} · ${L2('r.resp')} ${M(p.resp)}`}).join('\n')+'\n\n';
  s+=c.transfers.length?L2('r.transfers')+':\n'+c.transfers.map(f=>`${memberById(f.from).name} → ${memberById(f.to).name} ${M(f.amount)}`).join('\n'):L2('r.settled');
  return s+'\n— Triply ♡'}
function copySummary(){const s=summaryText();const fallback=()=>{toast(t('rc.copyFail'),'warn');openSheet({title:esc(t('rc.copy')),body:`<textarea class="inp" style="min-height:280px;font-size:13px" readonly id="sumTxt">${esc(s)}</textarea>`,onMount(sh){const ta=$('#sumTxt',sh);setTimeout(()=>{ta.focus();ta.select()},360)}})};
  try{navigator.clipboard.writeText(s).then(()=>toast(t('rc.copied')),fallback)}catch(e){fallback()}}

   const left=computeTrip(d.trip).transfers.length;toast(left?t('toast.settled'):t('toast.allSettled'),'ok',()=>{s.status='void';commit()});if(!left)setTimeout(()=>burst(innerWidth/2,innerHeight/3,110),250)},
 undoSettle:el=>{const s=db.settlements.find(x=>x.id===el.dataset.id);if(!s||s.status!=='paid')return;s.status='void';logAct({tripId:s.tripId,kind:'settle_undo',ref:s.id,from:s.from,to:s.to});commit();toast(t('toast.undone'))},
 rcSet:el=>{const k=el.dataset.k;settings.rc[k]=el.dataset.v;saveSettings();
   $$(`[data-act="rcSet"][data-k="${k}"]`).forEach(b=>b.classList.toggle('on',b===el));updateReceipt(k==='style')},
 rcToggle:el=>{const k=el.dataset.k;settings.rc[k]=settings.rc[k]===false;el.setAttribute('aria-checked',settings.rc[k]);saveSettings();updateReceipt(false)},
 reprint:()=>updateReceipt(true),
 exportPNG:el=>exportPNG(el), exportPDF:el=>exportPDF(el), shareRc:el=>shareRc(el), copySummary:()=>copySummary(),
 setLang:el=>{settings.lang=el.dataset.v;settings.rc.lang=null;saveSettings();applyTheme();render(false)},
 toggleLang:()=>{settings.lang=other(settings.lang);settings.rc.lang=null;saveSettings();applyTheme();render(false)},
 setSecondary:()=>{settings.secondary=!settings.secondary;saveSettings();render(false)},
 setTheme:el=>{settings.theme=el.dataset.v;saveSettings();applyTheme();render(false)},
 memColor:el=>{memberById(el.dataset.id).color=el.dataset.v;commit()},
 dlIcon:async el=>{busy(el,true);try{const img=new Image();img.src=ICON_URL;await img.decode();const cv=document.createElement('canvas');cv.width=cv.height=1024;cv.getContext('2d').drawImage(img,0,0,1024,1024);
   const blob=await new Promise(r=>cv.toBlob(r,'image/png'));await offerFile('triply-app-icon.png',blob,cv.toDataURL('image/png'))}catch(e){toast(t('rc.exportFail'),'bad')}finally{busy(el,false)}},
 exportJSON:async()=>{if(await getDownloads()||!inFrame){await offerFile('triply-backup-'+todayStr()+'.json',JSON.stringify(db,null,2),null,'application/json');return}if(false){await offerFile('triply-backup-'+todayStr()+'.json',JSON.stringify(db,null,2),null);return}openSheet({title:esc(t('set.export')),body:`<textarea class="inp" style="min-height:300px;font-size:12px" readonly>${esc(JSON.stringify(db))}</textarea>`})},
 importJSON:()=>{const fi=$('#fileImport');fi.value='';fi.onchange=()=>{const f=fi.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const d=safeParse(fr.result);if(!validDB(d)){toast(t('set.importBad'),'bad');return}
   confirmSheet({title:t('set.importQ'),body:t('set.importBody',{n:d.trips.length}),onOk(){db=normalizeDB(d);db.demo=false;resetSel();commit();toast(t('set.imported'))}})};fr.readAsText(f)};fi.click()},
 resetDemo:()=>confirmSheet({title:t('set.resetQ'),body:t('set.resetBody'),onOk(){db=seed();resetSel();commit();toast(t('toast.saved'))}}),
 clearAll:()=>confirmSheet({title:t('set.clearQ'),body:t('set.clearBody'),ok:t('common.yesDelete'),danger:true,onOk(){db={version:1,demo:false,members:[{id:'m1',name:memberById(settings.me).name||'Me',color:MEMBER_COLORS[0]}],trips:[],places:[],expenses:[],settlements:[],activity:[]};settings.me='m1';resetSel();commit();toast(t('toast.deleted'))}}),
 startFresh:()=>A.clearAll()
};
function resetSel(){['planTrip','dashTrip','moneyTrip','rcTrip'].forEach(k=>settings[k]=null);if(!db.members.some(m=>m.id===settings.me))settings.me=db.members[0]?.id;saveSettings()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.closest('.sheet [data-close]'))return;const fn=A[el.dataset.act];if(!fn)return;if(el.tagName==='A')e.preventDefault();fn(el,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const k=el.dataset.change;
  if(k==='tripSel'){settings[el.dataset.key]=el.value;if(el.dataset.key==='moneyTrip')ui.filters={q:'',payer:'',cat:'',type:'',place:''};if(el.dataset.key==='rcTrip')settings.rc.person='all';saveSettings();render(true)}
  if(k==='filter'){ui.filters[el.dataset.k]=el.value;render(false)}
  if(k==='setMe'){settings.me=el.value;saveSettings();render(false)}
  if(k==='pcCustom'){pcState().custom[el.dataset.k]=el.value;saveSettings();pcRefresh()}});
let qT;document.addEventListener('input',e=>{const di=e.target.dataset.input;
  if(di==='pcAmt'){pcState().amount=parseMoney(e.target.value,'THB');saveSettings();pcRefresh();return}
  if(di==='pcNote'){pcState().note=e.target.value;saveSettings();pcRefresh();return}
  if(di==='pcCustom'){pcState().custom[e.target.dataset.k]=e.target.value;saveSettings();pcRefresh();return}if(e.target.dataset.input==='filterQ'){ui.filters.q=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=e.target.selectionStart;render(false);const i=$('#fq');if(i){i.focus();i.setSelectionRange(pos,pos)}},220)}});

/* =========================================================
   15. BOOT
   ========================================================= */
$$('[data-icon]').forEach(i=>i.src=ICON_URL);
applyTheme();
(function splash(){const s=$('#splash');$('#splashIcon').src=ICON_URL;$('#splashWord').innerHTML=[...'Triply'].map((ch,i)=>`<span style="--i:${i}">${ch}</span>`).join('');$('#splashTag').textContent='Plan · Travel · Together';
  if(reduce){s.classList.add('done');return}setTimeout(()=>s.classList.add('done'),1250)})();
render(true);
/* deep link: #plan=<name> loads plans/<name>.txt into the paste sheet (works on the hosted app) */
(function tripLink(){if(/^#trip=chiangmai-2026$/.test(location.hash||'')){try{history.replaceState(null,'','#plan')}catch(e){}setTimeout(importPreparedTrip,1400)}})();
(async function planLink(){const m=(location.hash||'').match(/^#plan=([\w\-]+)$/);if(!m)return;
  let txt='';try{const r=await fetch('plans/'+m[1]+'.txt',{cache:'no-store'});if(r.ok)txt=await r.text()}catch(e){}
  if(!txt&&m[1]==='chiangmai-day3')txt=DAY3_TEXT;if(!txt)return;
  try{history.replaceState(null,'','#plan')}catch(e){}
  setTimeout(()=>{if(!db.trips.length){toast(t('form.noTrip'),'warn');tripForm();return}
    const tid=resolveTrip('planTrip');const tr=tripById(tid);route='plan';render(true);pasteForm(tid,tripDays(tr).slice(-1)[0],txt)},1400)})();
if('serviceWorker' in navigator&&!inFrame&&/^https?:/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
